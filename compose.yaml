# 868.no Map (Meshtastic MQTT mesh map)
#   docker compose up -d --build                 production, built locally (mount ./secrets, see README)
#   BACKEND_IMAGE=ghcr.io/868-no/map-backend:latest WEB_IMAGE=ghcr.io/868-no/map-web:latest \
#     BASEMAP_IMAGE=ghcr.io/868-no/map-basemap:latest \
#     docker compose pull backend web basemap && docker compose up -d   production, published images
#   deploy/compose.production.yaml               production configured entirely in one Compose file
#   DEMO_MODE=true docker compose --profile demo up -d --build   offline demo
name: meshmap

x-backend: &backend
  build: ./backend
  image: ${BACKEND_IMAGE:-meshmap-backend:local}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./secrets:/run/secrets:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meshmap}
      POSTGRES_USER: ${POSTGRES_USER:-meshmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Ephemeral by design: no RDB snapshots, no AOF; bounded memory with LRU eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    command: ["serve"]
    # Time to drain MQTT input, flush the writer and finish requests on
    # shutdown (default 10 s), as in deploy/compose.production.yaml.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/meshmap", "healthcheck", "--live"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  maintenance:
    <<: *backend
    command: ["maintenance"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        E2E_HOOKS: ${E2E_HOOKS:-false}
        # Where the map links for its source (GPL-3.0); set it for a modified version.
        SOURCE_URL: ${SOURCE_URL:-https://github.com/868-no/map}
        # The commit shown as the version in Settings, e.g. SOURCE_REVISION=$(git rev-parse HEAD).
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    image: ${WEB_IMAGE:-meshmap-web:local}
    restart: unless-stopped
    environment:
      # Extra hosts the page may fetch from, e.g. an online basemap (docs/basemap.md).
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
    # On this host's loopback only: a port Docker publishes bypasses ufw and
    # similar host firewalls, and web must be reached through the TLS proxy
    # (docs/operations.md). WEB_BIND=0.0.0.0 to reach it from other machines.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      # Self-hosted basemap, kept present and fresh by the basemap service
      - ./data/basemap:/srv/tiles:ro
      # Optional access control snippets (see docs/operations.md)
      - ./deploy/caddy-auth:/etc/caddy/auth:ro
    depends_on:
      backend: { condition: service_healthy }

  # Builds data/basemap/basemap.pmtiles when it is missing or older than
  # BASEMAP_MAX_AGE_DAYS, then idles. A build downloads several GB and needs
  # about PLANETILER_HEAP of memory (default 8g for Norway).
  basemap:
    build: ./basemap
    image: ${BASEMAP_IMAGE:-meshmap-basemap:local}
    restart: unless-stopped
    # Not root: it writes into ./data/basemap on the host, which should stay
    # the host user's (scripts/basemap_import.sh writes there as that user
    # too). BASEMAP_USER=$(id -u):$(id -g) in .env when that is not 1000.
    user: ${BASEMAP_USER:-1000:1000}
    environment:
      BASEMAP_AREA: ${BASEMAP_AREA:-norway}
      BASEMAP_BOUNDS: ${BASEMAP_BOUNDS:-world}
      BASEMAP_MAX_AGE_DAYS: ${BASEMAP_MAX_AGE_DAYS:-30}
      BASEMAP_LANGUAGES: ${BASEMAP_LANGUAGES:-no,nb,nn,se,en}
      PLANETILER_HEAP: ${PLANETILER_HEAP:-8g}
    volumes:
      - ./data/basemap:/data

  mosquitto:
    profiles: [demo]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # Not published to the host: reachable only on the compose network.

  demo-publisher:
    profiles: [demo]
    <<: *backend
    command: ["demo-publish", "--host", "mosquitto", "--rate", "${DEMO_RATE:-5}"]
    depends_on:
      mosquitto: { condition: service_started }

volumes:
  pgdata:
