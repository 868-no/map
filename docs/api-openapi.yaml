          examples:
            - https://example.com/api/schemas/RetentionBody.json
          format: uri
          readOnly: true
          type: string
        configured_cutoff:
          description: "Oldest selectable instant: now minus the configured retention"
          format: date-time
          type: string
        earliest_observation:
          description: Oldest observed_at actually retained (may be later than the cutoff)
          format: date-time
          type: string
        latest_observation:
          format: date-time
          type: string
        now:
          format: date-time
          type: string
        retention_months:
          format: int64
          type: integer
      required:
        - now
        - configured_cutoff
        - retention_months
      type: object
    SignatureCounts:
      additionalProperties: false
