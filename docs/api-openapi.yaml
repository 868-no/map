          type: string
        rolling:
          type: boolean
        start:
          format: date-time
          type: string
      required:
        - start
        - end
        - rolling
      type: object
info:
  description: "Time-isolated views of a Meshtastic mesh reconstructed from MQTT observations. Every mesh-derived field is computed only from observations inside the requested half-open interval [start, end). Timestamps are observed_at: when this service received the MQTT message, not RF transmission time."
  title: Meshtastic MQTT Mesh Observatory API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/capabilities:
    get:
      operationId: capabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Supported windows, presets, feature flags and map defaults (no secrets)
      tags:
        - meta
  /api/v1/edges:
    get:
      operationId: edges
      parameters:
        - description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
          explode: false
          in: query
          name: start
          schema:
            description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
            examples:
              - "2026-10-28T00:00:00Z"
            type: string
        - description: Exclusive end, RFC 3339.
          explode: false
          in: query
          name: end
          schema:
            description: Exclusive end, RFC 3339.
            examples:
              - "2026-10-31T00:00:00Z"
            type: string
        - description: Rolling window length (1h to 168h); default 72h.
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length (1h to 168h); default 72h.
            examples:
              - 72h
            type: string
        - description: Channel names, comma-separated
          explode: false
          in: query
          name: channel
          schema:
            description: Channel names, comma-separated
            type: string
        - description: Broker ids, comma-separated
          explode: false
          in: query
          name: broker
          schema:
            description: Broker ids, comma-separated
            type: string
        - description: Gateway node ids (!xxxxxxxx), comma-separated
          explode: false
          in: query
          name: gateway
          schema:
            description: Gateway node ids (!xxxxxxxx), comma-separated
            type: string
        - description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
          explode: false
          in: query
          name: type
          schema:
            description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
            type: string
        - description: "Keep edges having any of these evidence types: neighbor, traceroute, direct_rf, relay_hint (comma-separated)"
          explode: false
          in: query
          name: evidence
          schema:
            description: "Keep edges having any of these evidence types: neighbor, traceroute, direct_rf, relay_hint (comma-separated)"
            type: string
        - explode: false
          in: query
          name: min_confidence
          schema:
            default: low
            enum:
              - low
              - medium
              - high
            type: string
        - description: "west,south,east,north: keep edges with an endpoint positioned (reported or estimated) inside"
          explode: false
          in: query
          name: bbox
          schema:
            description: "west,south,east,north: keep edges with an endpoint positioned (reported or estimated) inside"
            type: string
        - description: Include relay-hint-only (inferred) links
          explode: false
          in: query
          name: include_inferred
          schema:
            default: true
            description: Include relay-hint-only (inferred) links
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgesBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Evidence-backed directed links with provenance and per-direction radio statistics
      tags:
        - mesh
  /api/v1/nodes/{id}:
    get:
      operationId: node
      parameters:
        - description: Node id (!xxxxxxxx) or decimal node number
          in: path
          name: id
          required: true
          schema:
            description: Node id (!xxxxxxxx) or decimal node number
            examples:
              - "!a1b2c3d4"
            type: string
        - description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
          explode: false
          in: query
          name: start
          schema:
            description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
            examples:
              - "2026-10-28T00:00:00Z"
            type: string
        - description: Exclusive end, RFC 3339.
          explode: false
          in: query
          name: end
          schema:
            description: Exclusive end, RFC 3339.
            examples:
              - "2026-10-31T00:00:00Z"
            type: string
        - description: Rolling window length (1h to 168h); default 72h.
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length (1h to 168h); default 72h.
            examples:
              - 72h
            type: string
        - description: Channel names, comma-separated
          explode: false
          in: query
          name: channel
          schema:
            description: Channel names, comma-separated
            type: string
        - description: Broker ids, comma-separated
          explode: false
          in: query
          name: broker
          schema:
            description: Broker ids, comma-separated
            type: string
        - description: Gateway node ids (!xxxxxxxx), comma-separated
          explode: false
          in: query
          name: gateway
          schema:
            description: Gateway node ids (!xxxxxxxx), comma-separated
            type: string
        - description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
          explode: false
          in: query
          name: type
          schema:
            description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: One node's in-window details and bounded evidence
      tags:
        - mesh
  /api/v1/observations:
    get:
      operationId: observations
      parameters:
        - description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
          explode: false
          in: query
          name: start
          schema:
            description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
            examples:
              - "2026-10-28T00:00:00Z"
            type: string
        - description: Exclusive end, RFC 3339.
          explode: false
          in: query
          name: end
          schema:
            description: Exclusive end, RFC 3339.
            examples:
              - "2026-10-31T00:00:00Z"
            type: string
        - description: Rolling window length (1h to 168h); default 72h.
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length (1h to 168h); default 72h.
            examples:
              - 72h
            type: string
        - description: Narrow the lower bound to this instant (RFC 3339); clamped to the window, never widening it
          explode: false
          in: query
          name: since
          schema:
            description: Narrow the lower bound to this instant (RFC 3339); clamped to the window, never widening it
            type: string
        - description: Narrow the upper bound to this instant (RFC 3339); clamped to the window
          explode: false
          in: query
          name: until
          schema:
            description: Narrow the upper bound to this instant (RFC 3339); clamped to the window
            type: string
        - description: "Page cursor: next_cursor from the previous page"
          explode: false
          in: query
          name: cursor
          schema:
            description: "Page cursor: next_cursor from the previous page"
            type: string
        - description: Page size (default and maximum 20000)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (default and maximum 20000)
            format: int64
            maximum: 20000
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationsBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Decoded observations of a window, paged, for deriving views in the browser
      tags:
        - mesh
  /api/v1/retention:
    get:
      operationId: retention
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retention cutoff, earliest/latest retained observation and server time
      tags:
        - meta
  /api/v1/snapshot:
    get:
      operationId: snapshot
      parameters:
        - description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
          explode: false
          in: query
          name: start
          schema:
            description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
            examples:
              - "2026-10-28T00:00:00Z"
            type: string
        - description: Exclusive end, RFC 3339.
          explode: false
          in: query
          name: end
          schema:
            description: Exclusive end, RFC 3339.
            examples:
              - "2026-10-31T00:00:00Z"
            type: string
        - description: Rolling window length (1h to 168h); default 72h.
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length (1h to 168h); default 72h.
            examples:
              - 72h
            type: string
        - description: Channel names, comma-separated
          explode: false
          in: query
          name: channel
          schema:
            description: Channel names, comma-separated
            type: string
        - description: Broker ids, comma-separated
          explode: false
          in: query
          name: broker
          schema:
            description: Broker ids, comma-separated
            type: string
        - description: Gateway node ids (!xxxxxxxx), comma-separated
          explode: false
          in: query
          name: gateway
          schema:
            description: Gateway node ids (!xxxxxxxx), comma-separated
            type: string
        - description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
          explode: false
          in: query
          name: type
          schema:
            description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Time-isolated nodes, positions and counts for a window
      tags:
        - mesh
  /api/v1/stream:
    get:
      description: "Events: `delta` (new receptions), `heartbeat` (every 15 s, current window bounds), `retention` (rows deleted; refetch), `status` (live availability)."
      operationId: stream
      parameters:
        - description: "Not allowed: live updates apply only to the rolling window"
          explode: false
          in: query
          name: start
          schema:
            description: "Not allowed: live updates apply only to the rolling window"
            type: string
        - description: "Not allowed: live updates apply only to the rolling window"
          explode: false
          in: query
          name: end
          schema:
            description: "Not allowed: live updates apply only to the rolling window"
            type: string
        - description: Rolling window length; default 72h
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length; default 72h
            examples:
              - 72h
            type: string
        - description: Channel names, comma-separated
          explode: false
          in: query
          name: channel
          schema:
            description: Channel names, comma-separated
            type: string
        - description: Broker ids, comma-separated
          explode: false
          in: query
          name: broker
          schema:
            description: Broker ids, comma-separated
            type: string
        - description: Gateway node ids (!xxxxxxxx), comma-separated
          explode: false
          in: query
          name: gateway
          schema:
            description: Gateway node ids (!xxxxxxxx), comma-separated
            type: string
        - description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
          explode: false
          in: query
          name: type
          schema:
            description: Packet types (nodeinfo, position, mapreport, telemetry, neighborinfo, traceroute, text, routing, other), comma-separated
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/LiveDelta"
                        event:
                          const: delta
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event delta
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Heartbeat"
                        event:
                          const: heartbeat
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event heartbeat
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Status"
                        event:
                          const: retention
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event retention
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/LiveStatus"
                        event:
                          const: status
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event status
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Live updates for the rolling window (SSE)
      tags:
        - live
  /api/v1/traffic:
    get:
      operationId: traffic
      parameters:
        - description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
