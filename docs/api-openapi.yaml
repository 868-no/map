components:
  schemas:
    Bucket:
      additionalProperties: false
      properties:
        by_type:
          additionalProperties:
            format: int64
            type: integer
          type: object
        packets:
          description: unique logical packets first seen in this bucket
          format: int64
          type: integer
        receptions:
          description: distinct gateway receptions
          format: int64
          type: integer
        start:
          format: date-time
          type: string
      required:
        - start
        - packets
        - receptions
      type: object
    Calibration:
      additionalProperties: false
      properties:
        p0_dbm:
          format: double
          type: number
        path_loss_exponent:
          format: double
          type: number
      required:
        - p0_dbm
        - path_loss_exponent
      type: object
    CapabilitiesBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/CapabilitiesBody.json
          format: uri
          readOnly: true
          type: string
        decode_version:
          format: int64
          type: integer
        default_window_hours:
          format: int64
          type: integer
        features:
          $ref: "#/components/schemas/CapabilitiesBodyFeaturesStruct"
        geolocation:
          $ref: "#/components/schemas/GeoSettings"
        live_quantum_seconds:
          format: int64
          type: integer
        map:
          $ref: "#/components/schemas/CapabilitiesBodyMapStruct"
        max_window_hours:
          format: int64
          type: integer
        min_window_hours:
          format: int64
          type: integer
        presets:
          items:
            $ref: "#/components/schemas/Preset"
          type:
            - array
            - "null"
        retention_months:
          format: int64
          type: integer
        signature_policy:
          enum:
            - balanced
            - strict
          type: string
      required:
        - presets
        - default_window_hours
        - min_window_hours
        - max_window_hours
        - live_quantum_seconds
        - retention_months
        - map
        - features
        - geolocation
        - signature_policy
        - decode_version
      type: object
    CapabilitiesBodyFeaturesStruct:
      additionalProperties: false
      properties:
        geolocation:
          type: boolean
        live:
          type: boolean
      required:
        - geolocation
        - live
      type: object
    CapabilitiesBodyMapStruct:
      additionalProperties: false
      properties:
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        style_url:
          type: string
        tile_source:
          description: "Vector tile source for the style: pmtiles:///path for the self-hosted archive, or a TileJSON URL"
          type: string
        zoom:
          format: double
          type: number
      required:
        - lat
        - lon
        - zoom
        - style_url
        - tile_source
      type: object
    Counts:
      additionalProperties: false
      properties:
        by_type:
          additionalProperties:
            format: int64
            type: integer
          description: unique packets per packet type
          type: object
        edges:
          format: int64
          type: integer
        estimated:
          format: int64
          type: integer
        first_event:
          format: date-time
          type: string
        last_event:
          format: date-time
          type: string
        nodes:
          format: int64
          type: integer
        nodes_truncated:
          type: boolean
        packets:
          description: unique logical packets
          format: int64
          type: integer
        positioned:
          format: int64
          type: integer
        receptions:
          description: distinct gateway receptions
          format: int64
          type: integer
        referenced:
          format: int64
          type: integer
      required:
        - packets
        - receptions
        - nodes
        - referenced
        - positioned
        - estimated
        - edges
        - by_type
        - nodes_truncated
      type: object
    Edge:
      additionalProperties: false
      properties:
        confidence:
          enum:
            - high
            - medium
            - low
          type: string
        dst:
          examples:
            - "!0badf00d"
          type: string
        dst_num:
          format: int32
          minimum: 0
          type: integer
        evidence:
          $ref: "#/components/schemas/EvidenceCounts"
        first_at:
          format: date-time
          type: string
        inferred:
          description: true when supported only by relay-hint inference
          type: boolean
        last_at:
          format: date-time
          type: string
        reason:
          type: string
        rssi:
          $ref: "#/components/schemas/Stats"
          description: dBm measured at dst (gateway receptions only)
        samples:
          format: int64
          type: integer
        snr:
          $ref: "#/components/schemas/Stats"
          description: dB measured at dst
        src:
          examples:
            - "!a1b2c3d4"
          type: string
        src_num:
          format: int32
          minimum: 0
          type: integer
      required:
        - src
        - dst
        - src_num
        - dst_num
        - evidence
        - samples
        - confidence
        - inferred
        - reason
        - snr
        - rssi
        - first_at
        - last_at
      type: object
    EdgesBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/EdgesBody.json
          format: uri
          readOnly: true
          type: string
        edges:
          items:
            $ref: "#/components/schemas/Edge"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/Meta"
        total:
          description: edges in the window before evidence/confidence/bbox filtering
          format: int64
          type: integer
        truncated:
          type: boolean
      required:
        - meta
        - edges
        - truncated
        - total
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Estimate:
      additionalProperties: false
      properties:
        anchor_count:
          format: int64
          type: integer
        anchors:
          items:
            type: string
          type:
            - array
            - "null"
        evidence_from:
          format: date-time
          type: string
        evidence_to:
          format: date-time
          type: string
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        method:
          enum:
            - weighted_centroid
            - log_distance_wls
          type: string
        quality:
          enum:
            - very_low
            - low
          type: string
        reasons:
          items:
            type: string
          type:
            - array
            - "null"
        sample_count:
          format: int64
          type: integer
        uncertainty_radius_m:
          format: double
          type: number
      required:
        - lat
        - lon
        - uncertainty_radius_m
        - method
        - quality
        - anchor_count
        - sample_count
        - anchors
        - evidence_from
        - evidence_to
        - reasons
      type: object
    EvidenceCounts:
      additionalProperties: false
      properties:
        direct_rf:
          format: int64
          type: integer
        neighbor:
          format: int64
          type: integer
        relay_hint:
          format: int64
          type: integer
        traceroute:
          format: int64
          type: integer
      required:
        - neighbor
        - traceroute
        - direct_rf
        - relay_hint
      type: object
    Filters:
      additionalProperties: false
      properties:
        brokers:
          items:
            type: string
          type:
            - array
            - "null"
        channels:
          items:
            type: string
          type:
            - array
            - "null"
        gateways:
          items:
            format: int32
            minimum: 0
            type: integer
          type:
            - array
            - "null"
        types:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    GeoSettings:
      additionalProperties: false
      properties:
        calibration:
          $ref: "#/components/schemas/Calibration"
        enabled:
          type: boolean
        exclude:
          description: Node ids the operator excluded from estimates
          items:
            type: string
          type:
            - array
            - "null"
        floor_m:
          format: double
          type: number
        max_anchor_distance_m:
          format: double
          type: number
        min_anchor_spacing_m:
          format: double
          type: number
        min_anchors:
          format: int64
          type: integer
        min_precision_bits:
          format: int32
          minimum: 0
          type: integer
        min_samples:
          format: int64
          type: integer
        min_shape_ratio:
          format: double
          type: number
        min_spread_m:
          format: double
          type: number
        uncalibrated_floor_m:
          format: double
          type: number
      required:
        - enabled
        - min_precision_bits
        - exclude
        - min_anchors
        - min_samples
        - min_anchor_spacing_m
        - min_spread_m
        - min_shape_ratio
        - max_anchor_distance_m
        - floor_m
        - uncalibrated_floor_m
      type: object
    Hearing:
      additionalProperties: false
      properties:
        direct_rf:
          description: receptions proven to be zero-hop RF
          format: int64
          type: integer
        last_at:
          format: date-time
          type: string
        node:
          type: string
        receptions:
          format: int64
          type: integer
        rssi:
          $ref: "#/components/schemas/Stats"
          description: dBm, direct-RF receptions only
        snr:
          $ref: "#/components/schemas/Stats"
          description: dB, direct-RF receptions only
      required:
        - node
        - receptions
        - direct_rf
        - snr
        - rssi
        - last_at
      type: object
    Heartbeat:
      additionalProperties: false
      properties:
        now:
          format: date-time
          type: string
        window:
          $ref: "#/components/schemas/WindowEcho"
      required:
        - now
        - window
      type: object
    Identity:
      additionalProperties: false
      properties:
        has_public_key:
          type: boolean
        hw_model:
          type: string
        long_name:
          type: string
        observed_at:
          format: date-time
          type: string
        role:
          type: string
        short_name:
          type: string
        signature:
          enum:
            - verified
            - unsigned
            - unverifiable
            - not-applicable
          type: string
      required:
        - has_public_key
        - signature
        - observed_at
      type: object
    LiveDelta:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/LiveEvent"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    LiveEvent:
      additionalProperties: false
      properties:
        broker:
          type: string
        channel:
          type: string
        direct_rf:
          type: boolean
        gw:
          type: string
        hops:
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        id:
          format: int64
          type: integer
        lp:
          type: string
        node:
          type: string
        path:
          items:
            type: string
          type:
            - array
            - "null"
        relay:
          format: int32
          type: integer
        row:
          $ref: "#/components/schemas/ObsRow"
        rssi:
          format: int32
          type: integer
        rx:
          type: string
        sig:
          type: string
        snr:
          format: float
          type: number
        t:
          format: date-time
          type: string
        type:
          type: string
      required:
        - id
        - t
        - node
        - type
        - sig
        - broker
        - lp
        - rx
        - path
      type: object
    LiveStatus:
      additionalProperties: false
      properties:
        live:
          type: boolean
        reason:
          type: string
      required:
        - live
      type: object
    Meta:
      additionalProperties: false
      properties:
        filters:
          $ref: "#/components/schemas/Filters"
        generated_at:
          format: date-time
          type: string
        revision:
          description: Data generation; changes when in-window data, retention or configuration change
          type: string
        window:
          $ref: "#/components/schemas/WindowEcho"
      required:
        - window
        - revision
        - filters
        - generated_at
      type: object
    Node:
      additionalProperties: false
      properties:
        brokers:
          items:
            type: string
          type:
            - array
            - "null"
        estimate:
          $ref: "#/components/schemas/Estimate"
          description: Approximate location from in-window RF links; never a reported position
        estimate_note:
          description: Why no estimate was produced for an unpositioned node
          type: string
        first_seen:
          format: date-time
          type: string
        gateway_receptions:
          description: receptions this node uplinked as an MQTT gateway
          format: int64
          type: integer
        id:
          examples:
            - "!a1b2c3d4"
          type: string
        identity:
          $ref: "#/components/schemas/Identity"
        is_gateway:
          type: boolean
        last_seen:
          format: date-time
          type: string
        mqtt_opt_out:
          description: The node sent packets in the window without the OK-to-MQTT flag that reached us through another gateway; its NodeInfo is not stored, so it stays unnamed
          type: boolean
        num:
          format: int32
          minimum: 0
          type: integer
        packets:
          description: unique packets originated in window
          format: int64
          type: integer
        position:
          $ref: "#/components/schemas/Position"
        receptions:
          description: gateway receptions of those packets
          format: int64
          type: integer
        signatures:
          $ref: "#/components/schemas/SignatureCounts"
        status:
          description: "observed: sent or uplinked packets in the window; referenced: only mentioned by others' NeighborInfo/traceroutes"
          enum:
            - observed
            - referenced
          type: string
        telemetry:
          $ref: "#/components/schemas/Telemetry"
      required:
        - id
        - num
        - status
        - packets
        - receptions
        - gateway_receptions
        - is_gateway
        - signatures
      type: object
    NodeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/NodeBody.json
          format: uri
          readOnly: true
          type: string
        brokers:
          items:
            type: string
          type:
            - array
            - "null"
        estimate:
          $ref: "#/components/schemas/Estimate"
          description: Approximate location from in-window RF links; never a reported position
        estimate_note:
          description: Why no estimate was produced for an unpositioned node
          type: string
        first_seen:
          format: date-time
          type: string
        gateway_receptions:
          description: receptions this node uplinked as an MQTT gateway
          format: int64
          type: integer
        heard:
          description: sources this node uplinked as a gateway
          items:
            $ref: "#/components/schemas/Hearing"
          type:
            - array
            - "null"
        heard_by:
          description: gateways that uplinked this node's packets
          items:
            $ref: "#/components/schemas/Hearing"
          type:
            - array
            - "null"
        id:
          examples:
            - "!a1b2c3d4"
          type: string
        identity:
          $ref: "#/components/schemas/Identity"
        is_gateway:
          type: boolean
        last_seen:
          format: date-time
          type: string
        meta:
          $ref: "#/components/schemas/Meta"
        mqtt_opt_out:
          description: The node sent packets in the window without the OK-to-MQTT flag that reached us through another gateway; its NodeInfo is not stored, so it stays unnamed
          type: boolean
        num:
          format: int32
          minimum: 0
          type: integer
        packets:
          description: unique packets originated in window
          format: int64
          type: integer
        position:
          $ref: "#/components/schemas/Position"
        positions:
          items:
            $ref: "#/components/schemas/PositionSample"
          type:
            - array
            - "null"
        recent_packets:
          items:
            $ref: "#/components/schemas/PacketSummary"
          type:
            - array
            - "null"
        receptions:
          description: gateway receptions of those packets
          format: int64
          type: integer
        signatures:
          $ref: "#/components/schemas/SignatureCounts"
        status:
          description: "observed: sent or uplinked packets in the window; referenced: only mentioned by others' NeighborInfo/traceroutes"
          enum:
            - observed
            - referenced
          type: string
        telemetry:
          $ref: "#/components/schemas/Telemetry"
        telemetry_series:
          items:
            $ref: "#/components/schemas/TelemetrySample"
          type:
            - array
            - "null"
        truncated:
          type: boolean
      required:
        - meta
        - positions
        - telemetry_series
        - heard_by
        - heard
        - recent_packets
        - truncated
        - id
        - num
        - status
        - packets
        - receptions
        - gateway_receptions
        - is_gateway
        - signatures
      type: object
    ObsHop:
      additionalProperties: false
      properties:
        id:
          format: int32
          minimum: 0
          type: integer
        unknown:
          type: boolean
      required:
        - id
      type: object
    ObsNeighbor:
      additionalProperties: false
      properties:
        id:
          format: int32
          minimum: 0
          type: integer
        snr:
          format: double
          type: number
      required:
        - id
      type: object
    ObsNeighborInfo:
      additionalProperties: false
      properties:
        neighbors:
          items:
            $ref: "#/components/schemas/ObsNeighbor"
          type:
            - array
            - "null"
      required:
        - neighbors
      type: object
    ObsNodeInfo:
      additionalProperties: false
      properties:
        has_public_key:
          type: boolean
        hw_model:
          type: string
        identity_untrusted:
          type: boolean
        long_name:
          type: string
        role:
          type: string
        short_name:
          type: string
      type: object
    ObsPosition:
      additionalProperties: false
      properties:
        alt:
          format: int32
          type: integer
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        precision_bits:
          format: int32
          minimum: 0
          type: integer
        precision_known:
          type: boolean
      required:
        - lat
        - lon
        - precision_bits
        - precision_known
      type: object
    ObsRow:
      additionalProperties: false
      properties:
        b:
          type: string
        by:
          format: int64
          type: integer
        c:
          type: string
        cr:
          type: string
        d:
          format: int32
          minimum: 0
          type: integer
        dr:
          type: boolean
        g:
          format: int32
          minimum: 0
          type: integer
        hl:
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        hs:
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        i:
          format: int64
          type: integer
        l:
          description: logical packet key, first 8 bytes as hex
          type: string
        nb:
          $ref: "#/components/schemas/ObsNeighborInfo"
        ni:
          $ref: "#/components/schemas/ObsNodeInfo"
        nk:
          description: sent without OK-to-MQTT and uplinked by another gateway
          type: boolean
        o:
          description: observation key, first 8 bytes as hex
          type: string
        p:
          format: int32
          minimum: 0
          type: integer
        po:
          $ref: "#/components/schemas/ObsPosition"
        r:
          format: int32
          type: integer
        rr:
          type: string
        rs:
          format: int32
          type: integer
        s:
          format: int32
          minimum: 0
          type: integer
        sg:
          type: string
        sn:
          format: float
          type: number
        t:
          description: observed_at, Unix milliseconds (floored)
          format: int64
          type: integer
        te:
          $ref: "#/components/schemas/ObsTelemetry"
        tr:
          $ref: "#/components/schemas/ObsTraceroute"
        "y":
          type: string
      required:
        - i
        - t
        - b
        - s
        - "y"
        - l
        - o
        - sg
      type: object
    ObsTelemetry:
      additionalProperties: false
      properties:
        air_util:
          format: double
          type: number
        battery:
          format: double
          type: number
        ch_util:
          format: double
          type: number
        kind:
          type: string
        uptime:
          format: int32
          minimum: 0
          type: integer
        voltage:
          format: double
          type: number
      required:
        - kind
      type: object
    ObsTraceroute:
      additionalProperties: false
      properties:
        is_reply:
          type: boolean
        route:
          items:
            $ref: "#/components/schemas/ObsHop"
          type:
            - array
            - "null"
        route_back:
          items:
            $ref: "#/components/schemas/ObsHop"
          type:
            - array
            - "null"
        snr_back:
          items:
            format: double
            type:
              - number
              - "null"
          type:
            - array
            - "null"
        snr_towards:
          items:
            format: double
            type:
              - number
              - "null"
          type:
            - array
            - "null"
        valid:
          type: boolean
      required:
        - valid
        - is_reply
        - route
        - snr_towards
        - route_back
        - snr_back
      type: object
    ObservationsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ObservationsBody.json
          format: uri
          readOnly: true
          type: string
        generation:
          description: Decoder and configuration generation; rows from another generation must be discarded
          type: string
        more:
          description: More rows remain; request again with cursor = next_cursor
          type: boolean
        next_cursor:
          description: Opaque position after the last row returned (rows come in observed_at order)
          type: string
        now:
          description: Server time when the rows were read; lets clients follow the server clock between fetches
          format: date-time
          type: string
        rows:
          items:
            $ref: "#/components/schemas/ObsRow"
          type:
            - array
            - "null"
        since:
          description: Effective lower bound of the rows returned
          format: date-time
          type: string
        until:
          description: Effective upper bound (exclusive)
          format: date-time
          type: string
        window:
          $ref: "#/components/schemas/WindowEcho"
          description: The full window the rows belong to
      required:
        - window
        - since
        - until
        - generation
        - now
        - rows
        - more
      type: object
    PacketSummary:
      additionalProperties: false
      properties:
        at:
          description: first in-window reception
          format: date-time
          type: string
        bytes:
          format: int64
          type: integer
        channel:
          type: string
        crypto:
          type: string
        packet_id:
          format: int32
          minimum: 0
          type: integer
        receptions:
          format: int64
          type: integer
        signature:
          type: string
        to:
          type: string
        type:
          type: string
      required:
        - at
        - type
        - packet_id
        - signature
        - crypto
        - receptions
        - bytes
      type: object
    Position:
      additionalProperties: false
      properties:
        alt:
          format: int32
          type: integer
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        observed_at:
          format: date-time
          type: string
        precision_bits:
          format: int32
          minimum: 0
          type: integer
        precision_known:
          type: boolean
        signature:
          enum:
            - verified
            - unsigned
            - unverifiable
            - not-applicable
          type: string
        source:
          description: Packet type the position came from
          enum:
