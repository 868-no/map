          type: string
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        precision_bits:
          format: int32
          minimum: 0
          type: integer
        precision_known:
          type: boolean
        signature:
          type: string
      required:
        - at
        - lat
        - lon
        - precision_bits
        - precision_known
        - signature
      type: object
    Preset:
      additionalProperties: false
      properties:
        hours:
          examples:
            - 72
          format: int64
          type: integer
        label:
          examples:
            - 3d
          type: string
      required:
        - label
        - hours
      type: object
    RetentionBody:
      additionalProperties: false
      properties:
        $schema:
