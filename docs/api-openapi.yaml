components:
  schemas:
    Calibration:
      additionalProperties: false
      properties:
        p0_dbm:
          format: double
          type: number
        path_loss_exponent:
          format: double
          type: number
      required:
        - p0_dbm
        - path_loss_exponent
      type: object
    CapabilitiesBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/CapabilitiesBody.json
          format: uri
          readOnly: true
          type: string
        decode_version:
          format: int64
          type: integer
        default_window_hours:
          format: int64
          type: integer
        features:
          $ref: "#/components/schemas/CapabilitiesBodyFeaturesStruct"
        geolocation:
          $ref: "#/components/schemas/GeoSettings"
        live_quantum_seconds:
          format: int64
          type: integer
        map:
          $ref: "#/components/schemas/CapabilitiesBodyMapStruct"
        max_window_hours:
          format: int64
          type: integer
        min_window_hours:
          format: int64
          type: integer
        operator:
          $ref: "#/components/schemas/CapabilitiesBodyOperatorStruct"
        presets:
          items:
            $ref: "#/components/schemas/Preset"
          type:
            - array
            - "null"
        retention_months:
          format: int64
          type: integer
        signature_policy:
          enum:
            - balanced
            - strict
          type: string
      required:
        - presets
        - default_window_hours
        - min_window_hours
        - max_window_hours
        - live_quantum_seconds
        - retention_months
        - map
        - features
        - geolocation
        - signature_policy
        - decode_version
        - operator
      type: object
    CapabilitiesBodyFeaturesStruct:
      additionalProperties: false
      properties:
        geolocation:
          type: boolean
        live:
          type: boolean
      required:
        - geolocation
        - live
      type: object
    CapabilitiesBodyMapStruct:
      additionalProperties: false
      properties:
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        style_url:
          description: Map style for the dark theme
          type: string
        style_url_light:
          description: Map style for the light theme (same layers)
          type: string
        tile_source:
          description: "Vector tile source for the style: pmtiles:///path for the self-hosted archive, or a TileJSON URL"
          type: string
        zoom:
          format: double
          type: number
      required:
        - lat
        - lon
        - zoom
        - style_url
        - style_url_light
        - tile_source
      type: object
    CapabilitiesBodyOperatorStruct:
      additionalProperties: false
      properties:
        contact:
          description: How to reach the operator about privacy (e-mail address or URL)
          type: string
        name:
          description: Who runs this deployment
          type: string
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GeoSettings:
      additionalProperties: false
      properties:
        calibration:
          $ref: "#/components/schemas/Calibration"
        enabled:
          type: boolean
        exclude:
          description: Node ids the operator excluded from estimates
          items:
            type: string
          type:
            - array
            - "null"
        floor_m:
          format: double
          type: number
        max_anchor_distance_m:
          format: double
          type: number
        min_anchor_spacing_m:
          format: double
          type: number
        min_anchors:
          format: int64
          type: integer
        min_precision_bits:
          format: int32
          minimum: 0
          type: integer
        min_samples:
          format: int64
          type: integer
        min_shape_ratio:
          format: double
          type: number
        min_spread_m:
          format: double
          type: number
        uncalibrated_floor_m:
          format: double
          type: number
      required:
        - enabled
        - min_precision_bits
        - exclude
        - min_anchors
        - min_samples
        - min_anchor_spacing_m
        - min_spread_m
        - min_shape_ratio
        - max_anchor_distance_m
        - floor_m
        - uncalibrated_floor_m
      type: object
    Heartbeat:
      additionalProperties: false
      properties:
        now:
          format: date-time
          type: string
        window:
          $ref: "#/components/schemas/WindowEcho"
      required:
        - now
        - window
      type: object
    LiveDelta:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/LiveEvent"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    LiveEvent:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        row:
          $ref: "#/components/schemas/ObsRow"
        t:
          format: date-time
          type: string
      required:
        - id
        - t
        - row
      type: object
    LiveStatus:
      additionalProperties: false
      properties:
        live:
          type: boolean
        reason:
          type: string
      required:
        - live
      type: object
    NodeKeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/NodeKeyBody.json
          format: uri
          readOnly: true
          type: string
        announced_at:
          format: date-time
          type: string
        node:
          examples:
            - "!98644b01"
          type: string
        public_key:
          description: Base64 X25519 key from the node's newest retained NodeInfo that carried one
          type: string
        signature:
          description: Signature status of that NodeInfo
          type: string
        trusted_key:
          description: "Key of the earliest retained verified NodeInfo (trust on first use): signatures are checked against it"
          type: string
        trusted_since:
          format: date-time
          type: string
      required:
        - node
      type: object
    ObsHop:
      additionalProperties: false
      properties:
        id:
          format: int32
          minimum: 0
          type: integer
        unknown:
          type: boolean
      required:
        - id
      type: object
    ObsMapReport:
      additionalProperties: false
      properties:
        has_default_channel:
          description: the node uses a modem preset, the default frequency slot and a channel with the default name and key
          type: boolean
        hw_model:
          type: string
        long_name:
          type: string
        modem_preset:
          type: string
        region:
          type: string
        role:
          type: string
        short_name:
          type: string
      type: object
    ObsNeighbor:
      additionalProperties: false
      properties:
        id:
          format: int32
          minimum: 0
          type: integer
        snr:
          format: double
          type: number
      required:
        - id
      type: object
    ObsNeighborInfo:
      additionalProperties: false
      properties:
        neighbors:
          items:
            $ref: "#/components/schemas/ObsNeighbor"
          type:
            - array
            - "null"
      required:
        - neighbors
      type: object
    ObsNodeInfo:
      additionalProperties: false
      properties:
        has_public_key:
          type: boolean
        hw_model:
          type: string
        identity_untrusted:
          type: boolean
        long_name:
          type: string
        role:
          type: string
        short_name:
          type: string
      type: object
    ObsPosition:
      additionalProperties: false
      properties:
        alt:
          format: int32
          type: integer
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        precision_bits:
          format: int32
          minimum: 0
          type: integer
        precision_known:
          type: boolean
      required:
        - lat
        - lon
        - precision_bits
        - precision_known
      type: object
    ObsRouting:
      additionalProperties: false
      properties:
        error:
          description: Firmware Routing.Error name, e.g. NO_RESPONSE
          type: string
        kind:
          enum:
            - ack
            - error
            - route_request
            - route_reply
          type: string
        request_id:
          description: Packet id of the packet this answers
          format: int32
          minimum: 0
          type: integer
      required:
        - kind
      type: object
    ObsRow:
      additionalProperties: false
      properties:
        b:
          type: string
        by:
          format: int64
          type: integer
        c:
          type: string
        cr:
          type: string
        d:
          format: int32
          minimum: 0
          type: integer
        dr:
          type: boolean
        g:
          format: int32
          minimum: 0
          type: integer
        hl:
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        hs:
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        i:
          format: int64
          type: integer
        l:
          description: logical packet key, first 8 bytes as hex
          type: string
        mr:
          $ref: "#/components/schemas/ObsMapReport"
        nb:
          $ref: "#/components/schemas/ObsNeighborInfo"
        ni:
          $ref: "#/components/schemas/ObsNodeInfo"
        nk:
          description: sent without OK-to-MQTT and uplinked by another gateway
          type: boolean
        o:
          description: observation key, first 8 bytes as hex
          type: string
        p:
          format: int32
          minimum: 0
          type: integer
        po:
          $ref: "#/components/schemas/ObsPosition"
        r:
          format: int32
          type: integer
        rr:
          type: string
        rs:
          format: int32
          type: integer
        rt:
          $ref: "#/components/schemas/ObsRouting"
        s:
          format: int32
          minimum: 0
          type: integer
        sg:
          type: string
        sn:
          format: float
          type: number
        t:
          description: observed_at, Unix milliseconds (floored)
          format: int64
          type: integer
        te:
          $ref: "#/components/schemas/ObsTelemetry"
        tp:
          description: MQTT topic root the reception arrived on (before /2/e/...), e.g. msh/EU_868/NO/Trøndelag
          type: string
        tr:
          $ref: "#/components/schemas/ObsTraceroute"
        "y":
          type: string
      required:
        - i
        - t
        - b
        - s
        - "y"
        - l
        - o
        - sg
      type: object
    ObsTelemetry:
      additionalProperties: false
      properties:
        air_util:
          format: double
          type: number
        battery:
          format: double
          type: number
        ch_util:
          format: double
          type: number
        kind:
          type: string
        uptime:
          format: int32
          minimum: 0
          type: integer
        voltage:
          format: double
          type: number
      required:
        - kind
      type: object
    ObsTraceroute:
      additionalProperties: false
      properties:
        is_reply:
          type: boolean
        route:
          items:
            $ref: "#/components/schemas/ObsHop"
          type:
            - array
            - "null"
        route_back:
          items:
            $ref: "#/components/schemas/ObsHop"
          type:
            - array
            - "null"
        snr_back:
          items:
            format: double
            type:
              - number
              - "null"
          type:
            - array
            - "null"
        snr_towards:
          items:
            format: double
            type:
              - number
              - "null"
          type:
            - array
            - "null"
        valid:
          type: boolean
      required:
        - valid
        - is_reply
        - route
        - snr_towards
        - route_back
        - snr_back
      type: object
    ObservationsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ObservationsBody.json
          format: uri
          readOnly: true
          type: string
        generation:
          description: Decoder and configuration generation; rows from another generation must be discarded
          type: string
        more:
          description: More rows remain; request again with cursor = next_cursor
          type: boolean
        next_cursor:
          description: Opaque position after the last row returned (rows come in observed_at order)
          type: string
        now:
          description: Server time when the rows were read; lets clients follow the server clock between fetches
          format: date-time
          type: string
        rows:
          items:
            $ref: "#/components/schemas/ObsRow"
          type:
            - array
            - "null"
        since:
          description: Effective lower bound of the rows returned
          format: date-time
          type: string
        until:
          description: Effective upper bound (exclusive)
          format: date-time
          type: string
        window:
          $ref: "#/components/schemas/WindowEcho"
          description: The full window the rows belong to
      required:
        - window
        - since
        - until
        - generation
        - now
        - rows
        - more
      type: object
    Preset:
      additionalProperties: false
      properties:
        hours:
          examples:
            - 72
          format: int64
          type: integer
        label:
          examples:
            - 3d
          type: string
      required:
        - label
        - hours
      type: object
    RetentionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/RetentionBody.json
          format: uri
          readOnly: true
          type: string
        configured_cutoff:
          description: "Oldest selectable instant: now minus the configured retention"
          format: date-time
          type: string
        earliest_observation:
          description: Oldest observed_at actually retained (may be later than the cutoff)
          format: date-time
          type: string
        latest_observation:
          format: date-time
          type: string
        now:
          format: date-time
          type: string
        retention_months:
          format: int64
          type: integer
      required:
        - now
        - configured_cutoff
        - retention_months
      type: object
    Status:
      additionalProperties: false
      properties:
        cutoff:
          format: date-time
          type: string
        deleted_rows:
          format: int64
          type: integer
        duration_ms:
          format: int64
          type: integer
        last_run:
          format: date-time
          type: string
        table_bytes:
          format: int64
          type: integer
      required:
        - last_run
        - cutoff
        - deleted_rows
        - table_bytes
        - duration_ms
      type: object
    WindowEcho:
      additionalProperties: false
      properties:
        end:
          format: date-time
          type: string
        rolling:
          type: boolean
        start:
          format: date-time
          type: string
      required:
        - start
        - end
        - rolling
      type: object
info:
  description: "The packet log of a Meshtastic mesh observed over MQTT: decoded observations of a requested half-open interval [start, end), paged, plus a live stream of new ones. Browsers derive every mesh view (nodes, links, location estimates, traffic) from these rows themselves. Timestamps are observed_at: when this service received the MQTT message, not RF transmission time."
  title: 868.no Map API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/capabilities:
    get:
      operationId: capabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Supported windows, presets, feature flags and map defaults (no secrets)
      tags:
        - meta
  /api/v1/nodes/{id}/public-key:
    get:
      operationId: node-public-key
      parameters:
        - description: Node id, !xxxxxxxx or decimal
          in: path
          name: id
          required: true
          schema:
            description: Node id, !xxxxxxxx or decimal
            examples:
              - "!98644b01"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeKeyBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: A node's announced and trusted public keys from the retained log
      tags:
        - mesh
  /api/v1/observations:
    get:
      operationId: observations
      parameters:
        - description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
          explode: false
          in: query
          name: start
          schema:
            description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
            examples:
              - "2026-10-28T00:00:00Z"
            type: string
        - description: Exclusive end, RFC 3339.
          explode: false
          in: query
          name: end
          schema:
            description: Exclusive end, RFC 3339.
            examples:
              - "2026-10-31T00:00:00Z"
            type: string
        - description: Rolling window length (1h to 168h); default 72h.
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length (1h to 168h); default 72h.
            examples:
              - 72h
            type: string
        - description: Narrow the lower bound to this instant (RFC 3339); clamped to the window, never widening it
          explode: false
          in: query
          name: since
          schema:
            description: Narrow the lower bound to this instant (RFC 3339); clamped to the window, never widening it
            type: string
        - description: Narrow the upper bound to this instant (RFC 3339); clamped to the window
          explode: false
          in: query
          name: until
          schema:
            description: Narrow the upper bound to this instant (RFC 3339); clamped to the window
            type: string
        - description: "Page cursor: next_cursor from the previous page"
          explode: false
          in: query
          name: cursor
          schema:
            description: "Page cursor: next_cursor from the previous page"
            type: string
        - description: Page size (default and maximum 20000)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (default and maximum 20000)
            format: int64
            maximum: 20000
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationsBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Decoded observations of a window, paged, for deriving views in the browser
      tags:
        - mesh
  /api/v1/retention:
    get:
      operationId: retention
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retention cutoff, earliest/latest retained observation and server time
      tags:
        - meta
  /api/v1/stream:
    get:
      description: "Events: `delta` (new observations, each with its full row), `heartbeat` (every 15 s, current window bounds), `retention` (rows deleted; refetch), `status` (live availability)."
      operationId: stream
      parameters:
        - description: "Not allowed: live updates apply only to the rolling window"
          explode: false
          in: query
          name: start
          schema:
            description: "Not allowed: live updates apply only to the rolling window"
            type: string
        - description: "Not allowed: live updates apply only to the rolling window"
          explode: false
          in: query
          name: end
          schema:
            description: "Not allowed: live updates apply only to the rolling window"
            type: string
        - description: Rolling window length; default 72h
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length; default 72h
            examples:
              - 72h
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/LiveDelta"
                        event:
                          const: delta
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event delta
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Heartbeat"
                        event:
                          const: heartbeat
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event heartbeat
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Status"
                        event:
                          const: retention
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event retention
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/LiveStatus"
                        event:
                          const: status
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event status
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Live updates for the rolling window (SSE)
      tags:
        - live
