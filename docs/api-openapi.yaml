components:
  schemas:
    Antenna:
      additionalProperties: false
      properties:
        ground:
          description: Terrain height at the end's position
          format: double
          type: number
        height:
          description: Antenna height above sea level; absent when neither reported nor known from the terrain
          format: double
          type: number
        source:
          description: "reported: the altitude the node reports; terrain: the terrain plus 2 m"
          enum:
            - reported
            - terrain
            - none
          type: string
      required:
        - source
      type: object
    Calibration:
      additionalProperties: false
      properties:
        p0_dbm:
          format: double
          type: number
        path_loss_exponent:
          format: double
          type: number
      required:
        - p0_dbm
        - path_loss_exponent
      type: object
    CapabilitiesBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/CapabilitiesBody.json
          format: uri
          readOnly: true
          type: string
        decode_version:
          format: int64
          type: integer
        default_window_hours:
          format: int64
          type: integer
        features:
          $ref: "#/components/schemas/CapabilitiesBodyFeaturesStruct"
        geolocation:
          $ref: "#/components/schemas/GeoSettings"
        live_quantum_seconds:
          format: int64
          type: integer
        map:
          $ref: "#/components/schemas/CapabilitiesBodyMapStruct"
        max_window_hours:
          format: int64
          type: integer
        min_window_hours:
          format: int64
          type: integer
        operator:
          $ref: "#/components/schemas/CapabilitiesBodyOperatorStruct"
        presets:
          items:
            $ref: "#/components/schemas/Preset"
          type:
            - array
            - "null"
        retention_months:
          format: int64
          type: integer
        signature_policy:
          enum:
            - balanced
            - strict
          type: string
      required:
        - presets
        - default_window_hours
        - min_window_hours
        - max_window_hours
        - live_quantum_seconds
        - retention_months
        - map
        - features
        - geolocation
        - signature_policy
        - decode_version
        - operator
      type: object
    CapabilitiesBodyFeaturesStruct:
      additionalProperties: false
      properties:
        geolocation:
          type: boolean
        live:
          type: boolean
        terrain:
          description: /api/v1/terrain is served (D-143)
          type: boolean
        weather:
          description: GET /api/v1/weather is served (D-133)
          type: boolean
      required:
        - geolocation
        - live
        - weather
        - terrain
      type: object
    CapabilitiesBodyMapStruct:
      additionalProperties: false
      properties:
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        style_url:
          description: Map style for the dark theme
          type: string
        style_url_light:
          description: Map style for the light theme (same layers)
          type: string
        tile_source:
          description: "Vector tile source for the style: pmtiles:///path for the self-hosted archive, or a TileJSON URL"
          type: string
        zoom:
          format: double
          type: number
      required:
        - lat
        - lon
        - zoom
        - style_url
        - style_url_light
        - tile_source
      type: object
    CapabilitiesBodyOperatorStruct:
      additionalProperties: false
      properties:
        contact:
          description: How to reach the operator about privacy (e-mail address or URL)
          type: string
        name:
          description: Who runs this deployment
          type: string
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GeoSettings:
      additionalProperties: false
      properties:
        calibration:
          $ref: "#/components/schemas/Calibration"
        enabled:
          type: boolean
        exclude:
          description: Node ids the operator excluded from estimates
          items:
            type: string
          type:
            - array
            - "null"
        floor_m:
          format: double
          type: number
        max_anchor_distance_m:
          format: double
          type: number
        min_anchor_spacing_m:
          format: double
          type: number
        min_anchors:
          format: int64
          type: integer
        min_precision_bits:
          format: int32
          minimum: 0
          type: integer
        min_samples:
          format: int64
          type: integer
        min_shape_ratio:
          format: double
          type: number
        min_spread_m:
          format: double
          type: number
        uncalibrated_floor_m:
          format: double
          type: number
      required:
        - enabled
        - min_precision_bits
        - exclude
        - min_anchors
        - min_samples
        - min_anchor_spacing_m
        - min_spread_m
        - min_shape_ratio
        - max_anchor_distance_m
        - floor_m
        - uncalibrated_floor_m
      type: object
    Heartbeat:
      additionalProperties: false
      properties:
        now:
          format: date-time
          type: string
        window:
          $ref: "#/components/schemas/WindowEcho"
      required:
        - now
        - window
      type: object
    Hour:
      additionalProperties: false
      properties:
        cloud_pct:
          description: Cloud cover, %
          format: double
          type: number
        gust_ms:
          description: Strongest gust 10 m above ground, m/s, from the first hours of a MEPS forecast run (the analysis has none)
          format: double
          type: number
        humidity_pct:
          description: Relative humidity 2 m above ground, %
          format: double
          type: number
        precip_mm:
          description: Precipitation in the hour before t, mm
          format: double
          type: number
        sun_wm2:
          description: Sunlight reaching the ground (downwelling shortwave radiation), mean over the hour before t, W/m²
          format: double
          type: number
        t:
          description: Valid time (UTC, on the hour)
          format: date-time
          type: string
        temp_c:
          description: Air temperature 2 m above ground, °C
          format: double
          type: number
        wind_ms:
          description: Wind speed 10 m above ground, m/s
          format: double
          type: number
      required:
        - t
      type: object
    LiveDelta:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/LiveEvent"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    LiveEvent:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        row:
          $ref: "#/components/schemas/ObsRow"
        t:
          format: date-time
          type: string
      required:
        - id
        - t
        - row
      type: object
    LiveStatus:
      additionalProperties: false
      properties:
        live:
          type: boolean
        reason:
          type: string
      required:
        - live
      type: object
    NodeKeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/NodeKeyBody.json
          format: uri
          readOnly: true
          type: string
        announced_at:
          format: date-time
          type: string
        node:
          examples:
            - "!98644b01"
          type: string
        public_key:
          description: Base64 X25519 key from the node's newest retained NodeInfo that carried one
          type: string
        signature:
          description: Signature status of that NodeInfo
          type: string
        trusted_key:
          description: "Key of the first stored verified NodeInfo (trust on first use): signatures are checked against it"
          type: string
        trusted_since:
          format: date-time
          type: string
      required:
        - node
      type: object
    ObsHop:
      additionalProperties: false
      properties:
        id:
          format: int32
          minimum: 0
          type: integer
        unknown:
          type: boolean
      required:
        - id
      type: object
    ObsMapReport:
      additionalProperties: false
      properties:
        has_default_channel:
          description: the node uses a modem preset, the default frequency slot and a channel with the default name and key
          type: boolean
        hw_model:
          type: string
        long_name:
          type: string
        modem_preset:
          type: string
        region:
          type: string
        role:
          type: string
        short_name:
          type: string
      type: object
    ObsNeighbor:
      additionalProperties: false
      properties:
        id:
          format: int32
          minimum: 0
          type: integer
        snr:
          format: double
          type: number
      required:
        - id
      type: object
    ObsNeighborInfo:
      additionalProperties: false
      properties:
        neighbors:
          items:
            $ref: "#/components/schemas/ObsNeighbor"
          type:
            - array
            - "null"
      required:
        - neighbors
      type: object
    ObsNodeInfo:
      additionalProperties: false
      properties:
        has_public_key:
          type: boolean
        hw_model:
          type: string
        identity_untrusted:
          type: boolean
        key_id:
          format: int32
          minimum: 0
          type: integer
        long_name:
          type: string
        role:
          type: string
        short_name:
          type: string
      type: object
    ObsNodeStatus:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    ObsPosition:
      additionalProperties: false
      properties:
        alt:
          format: int32
          type: integer
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
        precision_bits:
          format: int32
          minimum: 0
          type: integer
        precision_known:
          type: boolean
      required:
        - lat
        - lon
        - precision_bits
        - precision_known
      type: object
    ObsRouting:
      additionalProperties: false
      properties:
        error:
          description: Firmware Routing.Error name, e.g. NO_RESPONSE
          type: string
        kind:
          enum:
            - ack
            - error
            - route_request
            - route_reply
          type: string
        request_id:
          description: Packet id of the packet this answers
          format: int32
          minimum: 0
          type: integer
      required:
        - kind
      type: object
    ObsRow:
      additionalProperties: false
      properties:
        b:
          type: string
        by:
          format: int64
          type: integer
        c:
          type: string
        cr:
          type: string
        d:
          format: int32
          minimum: 0
          type: integer
        dr:
          type: boolean
        g:
          format: int32
          minimum: 0
          type: integer
        hl:
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        hs:
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        i:
          format: int64
          type: integer
        iv:
          description: "Type invalid: why its content was not kept (sig_invalid, payload_invalid, ...); its sender may be forged"
          type: string
        l:
          description: logical packet key, first 8 bytes as hex
          type: string
        mr:
          $ref: "#/components/schemas/ObsMapReport"
        nb:
          $ref: "#/components/schemas/ObsNeighborInfo"
        ni:
          $ref: "#/components/schemas/ObsNodeInfo"
        nk:
          description: sent without OK-to-MQTT and uplinked by another gateway
          type: boolean
        ns:
          $ref: "#/components/schemas/ObsNodeStatus"
        o:
          description: observation key, first 8 bytes as hex
          type: string
        p:
          format: int32
          minimum: 0
          type: integer
        po:
          $ref: "#/components/schemas/ObsPosition"
        r:
          format: int32
          type: integer
        rr:
          type: string
        rs:
          format: int32
          type: integer
        rt:
          $ref: "#/components/schemas/ObsRouting"
        s:
          format: int32
          minimum: 0
          type: integer
        sf:
          $ref: "#/components/schemas/ObsStoreForward"
        sg:
          type: string
        sn:
          format: float
          type: number
        t:
          description: observed_at, Unix milliseconds (floored)
          format: int64
          type: integer
        te:
          $ref: "#/components/schemas/ObsTelemetry"
        tp:
          description: MQTT topic root the reception arrived on (before /2/e/...), e.g. msh/EU_868/NO/Trøndelag
          type: string
        tr:
          $ref: "#/components/schemas/ObsTraceroute"
        wa:
          description: The sender asked for an acknowledgement (D-109)
          type: boolean
        "y":
          type: string
      required:
        - i
        - t
        - b
        - s
        - "y"
        - l
        - o
        - sg
      type: object
    ObsStoreForward:
      additionalProperties: false
      properties:
        kind:
          type: string
        messages:
          description: "History: messages it will replay"
          format: int32
          minimum: 0
          type: integer
        period:
          description: Heartbeat interval, seconds
          format: int32
          minimum: 0
          type: integer
        text_bytes:
          format: int64
          type: integer
      required:
        - kind
      type: object
    ObsTelemetry:
      additionalProperties: false
      properties:
        air_util:
          format: double
          type: number
        battery:
          format: double
          type: number
        ch_util:
          format: double
          type: number
        humidity:
          description: Relative humidity, %
          format: double
          type: number
        kind:
          type: string
        pressure:
          description: Barometric pressure, hPa
          format: double
          type: number
        temp:
          description: Temperature, °C
          format: double
          type: number
        uptime:
          format: int32
          minimum: 0
          type: integer
        voltage:
          format: double
          type: number
      required:
        - kind
      type: object
    ObsTraceroute:
      additionalProperties: false
      properties:
        is_reply:
          type: boolean
        request_id:
          description: "A reply: the packet id of the request it answers"
          format: int32
          minimum: 0
          type: integer
        route:
          items:
            $ref: "#/components/schemas/ObsHop"
          type:
            - array
            - "null"
        route_back:
          items:
            $ref: "#/components/schemas/ObsHop"
          type:
            - array
            - "null"
        snr_back:
          items:
            format: double
            type:
              - number
              - "null"
          type:
            - array
            - "null"
        snr_towards:
          items:
            format: double
            type:
              - number
              - "null"
          type:
            - array
            - "null"
        valid:
          type: boolean
      required:
        - valid
        - is_reply
        - route
        - snr_towards
        - route_back
        - snr_back
      type: object
    ObservationsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ObservationsBody.json
          format: uri
          readOnly: true
          type: string
        generation:
          description: Decoder, row-format, configuration and history-revision generation; rows from another generation must be discarded
          type: string
        more:
          description: More rows remain; request again with cursor = next_cursor
          type: boolean
        next_cursor:
          description: Opaque position after the last row returned (rows come in observed_at order)
          type: string
        now:
          description: Server time when the rows were read; lets clients follow the server clock between fetches
          format: date-time
          type: string
        rows:
          items:
            $ref: "#/components/schemas/ObsRow"
          type:
            - array
            - "null"
        since:
          description: Effective lower bound of the rows returned
          format: date-time
          type: string
        until:
          description: Effective upper bound (exclusive)
          format: date-time
          type: string
        window:
          $ref: "#/components/schemas/WindowEcho"
          description: The full window the rows belong to
      required:
        - window
        - since
        - until
        - generation
        - now
        - rows
        - more
      type: object
    Preset:
      additionalProperties: false
      properties:
        hours:
          examples:
            - 72
          format: int64
          type: integer
        label:
          examples:
            - 3d
          type: string
      required:
        - label
        - hours
      type: object
    RetentionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/RetentionBody.json
          format: uri
          readOnly: true
          type: string
        configured_cutoff:
          description: "Oldest selectable instant: now minus the configured retention"
          format: date-time
          type: string
        earliest_observation:
          description: Oldest observed_at actually retained (may be later than the cutoff)
          format: date-time
          type: string
        generation:
          description: The generation /observations reports now; lets a client request whole days without waiting for it (D-170)
          type: string
        latest_observation:
          format: date-time
          type: string
        now:
          format: date-time
          type: string
        retention_months:
          format: int64
          type: integer
      required:
        - now
        - configured_cutoff
        - retention_months
        - generation
      type: object
    Sample:
      additionalProperties: false
      properties:
        bulge:
          description: How far the earth's curvature raises the ground here relative to the straight line, m
          format: double
          type: number
        d:
          description: Distance from the first end, m
          format: double
          type: number
        fresnel:
          description: Radius of the first Fresnel zone, m
          format: double
          type: number
        ground:
          description: Terrain height; absent where the terrain model has none (abroad)
          format: double
          type: number
        lat:
          format: double
          type: number
        line:
          description: Height of the straight line between the antennas
          format: double
          type: number
        lon:
          format: double
          type: number
      required:
        - d
        - lat
        - lon
        - bulge
        - line
        - fresnel
      type: object
    Status:
      additionalProperties: false
      properties:
        cutoff:
          format: date-time
          type: string
        deleted_rows:
          format: int64
          type: integer
        duration_ms:
          format: int64
          type: integer
        last_run:
          format: date-time
          type: string
        table_bytes:
          format: int64
          type: integer
      required:
        - last_run
        - cutoff
        - deleted_rows
        - table_bytes
        - duration_ms
      type: object
    TerrainClass:
      additionalProperties: false
      properties:
        class:
          enum:
            - clear
            - grazing
            - blocked
            - unknown
          type: string
        length_m:
          format: double
          type: number
        worst_clearance:
          description: Least free part of the first Fresnel zone, in Fresnel radii
          format: double
          type: number
      required:
        - class
        - length_m
        - worst_clearance
      type: object
    TerrainClassesInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/TerrainClassesInputBody.json
          format: uri
          readOnly: true
          type: string
        links:
          description: Links to classify, by the positions of their ends. A link with an end outside mainland Norway and its border strip (57.5–71.5° N, 4–31.5° E), or over 300 km long, is unknown; at most 120 000 distinct terrain points in all, else 422
          items:
            $ref: "#/components/schemas/TerrainLink"
          maxItems: 400
          type:
            - array
            - "null"
      required:
        - links
      type: object
    TerrainClassesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/TerrainClassesOutputBody.json
          format: uri
          readOnly: true
          type: string
        attribution:
          type: string
        classes:
          description: One per link, in order
          items:
            $ref: "#/components/schemas/TerrainClass"
          type:
            - array
            - "null"
        incomplete:
          description: Heights are still being fetched; ask again in a few seconds
          type: boolean
      required:
        - classes
        - attribution
      type: object
    TerrainLink:
      additionalProperties: false
      properties:
        alt1:
          description: "Altitude the first end reports, m above sea level; 0 or absent: none"
          format: double
          type: number
        alt2:
          format: double
          type: number
        lat1:
          format: double
          maximum: 90
          minimum: -90
          type: number
        lat2:
          format: double
          maximum: 90
          minimum: -90
          type: number
        lon1:
          format: double
          maximum: 180
          minimum: -180
          type: number
        lon2:
          format: double
          maximum: 180
          minimum: -180
          type: number
      required:
        - lat1
        - lon1
        - lat2
        - lon2
      type: object
    TerrainProfileBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/TerrainProfileBody.json
          format: uri
          readOnly: true
          type: string
        a:
          $ref: "#/components/schemas/Antenna"
          description: The first end's antenna
        attribution:
          type: string
        b:
          $ref: "#/components/schemas/Antenna"
          description: The second end's antenna
        class:
          description: "clear: at least 60 % of the first Fresnel zone free; grazing: the line is free, the zone is not; blocked: terrain cuts the line; unknown: the terrain model does not cover enough of it"
          enum:
            - clear
            - grazing
            - blocked
            - unknown
          type: string
        incomplete:
          description: Heights are still being fetched; ask again in a few seconds
          type: boolean
        length_m:
          format: double
          type: number
        samples:
          items:
            $ref: "#/components/schemas/Sample"
          type:
            - array
            - "null"
        worst_clearance:
          format: double
          type: number
        worst_d:
          format: double
          type: number
      required:
        - attribution
        - class
        - length_m
        - a
        - b
        - worst_d
        - worst_clearance
      type: object
    TrendBucket:
      additionalProperties: false
      properties:
        by_type:
          additionalProperties:
            format: int64
            type: integer
          description: Distinct packets by type
          type: object
        gateways:
          description: Distinct gateways that uplinked anything
          format: int64
          type: integer
        new_nodes:
          description: Nodes first heard in this bucket (within retention)
          format: int64
          type: integer
        nodes:
          description: Distinct nodes heard (senders)
          format: int64
          type: integer
        packets:
          description: Distinct packets
          format: int64
          type: integer
        receptions:
          description: Gateway receptions of them
          format: int64
          type: integer
        start:
          description: Bucket start in the requested time zone
          format: date-time
          type: string
      required:
        - start
        - nodes
        - gateways
        - new_nodes
        - packets
        - receptions
        - by_type
      type: object
    TrendsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/TrendsBody.json
          format: uri
          readOnly: true
          type: string
        bucket:
          type: string
        buckets:
          items:
            $ref: "#/components/schemas/TrendBucket"
          type:
            - array
            - "null"
        computed:
          format: date-time
          type: string
        since:
          description: "Oldest retained observation: the first bucket may be partial, and new_nodes counts from here"
          format: date-time
          type: string
        tz:
          type: string
      required:
        - bucket
        - tz
        - buckets
        - computed
      type: object
    WeatherBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/WeatherBody.json
          format: uri
          readOnly: true
          type: string
        attribution:
          type: string
        hours:
          description: Hourly values in [start, end), oldest first; hours the analysis lacks are left out
          items:
            $ref: "#/components/schemas/Hour"
          type:
            - array
            - "null"
        incomplete:
          description: Some hours are still being fetched; ask again in a few seconds
          type: boolean
      required:
        - hours
        - attribution
      type: object
    WindowEcho:
      additionalProperties: false
      properties:
        end:
          format: date-time
          type: string
        rolling:
          type: boolean
        start:
          format: date-time
          type: string
      required:
        - start
        - end
        - rolling
      type: object
info:
  description: "The packet log of a Meshtastic mesh observed over MQTT: decoded observations of a requested half-open interval [start, end), paged, plus a live stream of new ones. Browsers derive every mesh view (nodes, links, location estimates, traffic) from these rows themselves. Timestamps are observed_at: when this service received the MQTT message, not RF transmission time."
  title: 868.no Map API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/capabilities:
    get:
      operationId: capabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Supported windows, presets, feature flags and map defaults (no secrets)
      tags:
        - meta
  /api/v1/nodes/{id}/public-key:
    get:
      operationId: node-public-key
      parameters:
        - description: Node id, !xxxxxxxx or decimal
          in: path
          name: id
          required: true
          schema:
            description: Node id, !xxxxxxxx or decimal
            examples:
              - "!98644b01"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeKeyBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: A node's announced and trusted public keys from the retained log
      tags:
        - mesh
  /api/v1/observations:
    get:
      operationId: observations
      parameters:
        - description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
          explode: false
          in: query
          name: start
          schema:
            description: Inclusive start, RFC 3339 (UTC recommended). Omit start and end for the rolling live window.
            examples:
              - "2026-10-28T00:00:00Z"
            type: string
        - description: Exclusive end, RFC 3339.
          explode: false
          in: query
          name: end
          schema:
            description: Exclusive end, RFC 3339.
            examples:
              - "2026-10-31T00:00:00Z"
            type: string
        - description: Rolling window length (1h to 168h); default 72h.
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length (1h to 168h); default 72h.
            examples:
              - 72h
            type: string
        - description: Narrow the lower bound to this instant (RFC 3339); clamped to the window, never widening it
          explode: false
          in: query
          name: since
          schema:
            description: Narrow the lower bound to this instant (RFC 3339); clamped to the window, never widening it
            type: string
        - description: Narrow the upper bound to this instant (RFC 3339); clamped to the window
          explode: false
          in: query
          name: until
          schema:
            description: Narrow the upper bound to this instant (RFC 3339); clamped to the window
            type: string
        - description: "Page cursor: next_cursor from the previous page"
          explode: false
          in: query
          name: cursor
          schema:
            description: "Page cursor: next_cursor from the previous page"
            type: string
        - description: Page size (default and maximum 20000)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (default and maximum 20000)
            format: int64
            maximum: 20000
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationsBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Decoded observations of a window, paged, for deriving views in the browser
      tags:
        - mesh
  /api/v1/observations/day/{date}:
    get:
      description: "The rows /observations returns for [date, date + 24 h), as one body of the same shape (more is false). Once the day ended at least 30 minutes ago, lies wholly within retention, has no row awaiting a new decoding, and no import of history is running, the answer is Cache-Control: public, max-age=31536000, immutable with a strong ETag; otherwise no-store (a day the retention cutoff cuts into, or today, is served from the cutoff or up to now). The URL names the generation, so a cached body can never stand for another: a different one is answered 409."
      operationId: observations-day
      parameters:
        - description: UTC day, YYYY-MM-DD
          in: path
          name: date
          required: true
          schema:
            description: UTC day, YYYY-MM-DD
            examples:
              - "2026-11-01"
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
            type: string
        - description: The generation the client holds (from /observations); another one is answered 409 with the current one
          explode: false
          in: query
          name: generation
          required: true
          schema:
            description: The generation the client holds (from /observations); another one is answered 409 with the current one
            type: string
        - description: ETag of a copy held; 304 when it is still the day's rows
          in: header
          name: If-None-Match
          schema:
            description: ETag of a copy held; 304 when it is still the day's rows
            type: string
        - in: header
          name: Accept-Encoding
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationsBody"
          description: OK
        "304":
          description: "Not modified: the copy named by If-None-Match is still the day's rows"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Every decoded observation of one UTC day, cached and immutable once the day is final (D-158)
      tags:
        - mesh
  /api/v1/retention:
    get:
      operationId: retention
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retention cutoff, earliest/latest retained observation and server time
      tags:
        - meta
  /api/v1/stream:
    get:
      description: "Events: `delta` (new observations, each with its full row), `heartbeat` (every 15 s, current window bounds), `retention` (rows deleted; refetch), `status` (live availability)."
      operationId: stream
      parameters:
        - description: "Not allowed: live updates apply only to the rolling window"
          explode: false
          in: query
          name: start
          schema:
            description: "Not allowed: live updates apply only to the rolling window"
            type: string
        - description: "Not allowed: live updates apply only to the rolling window"
          explode: false
          in: query
          name: end
          schema:
            description: "Not allowed: live updates apply only to the rolling window"
            type: string
        - description: Rolling window length; default 72h
          explode: false
          in: query
          name: duration
          schema:
            description: Rolling window length; default 72h
            examples:
              - 72h
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/LiveDelta"
                        event:
                          const: delta
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event delta
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Heartbeat"
                        event:
                          const: heartbeat
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event heartbeat
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Status"
                        event:
                          const: retention
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event retention
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/LiveStatus"
                        event:
                          const: status
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event status
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Live updates for the rolling window (SSE)
      tags:
        - live
  /api/v1/terrain/classes:
    post:
      operationId: terrain-classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerrainClassesInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerrainClassesOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Line-of-sight classes of links between pairs of points
      tags:
        - meta
  /api/v1/terrain/profile:
    get:
      operationId: terrain-profile
      parameters:
        - description: Latitude of the first end; both ends must lie in mainland Norway or its border strip (57.5–71.5° N, 4–31.5° E), else 422
          explode: false
          in: query
          name: lat1
          required: true
          schema:
            description: Latitude of the first end; both ends must lie in mainland Norway or its border strip (57.5–71.5° N, 4–31.5° E), else 422
            format: double
            maximum: 90
            minimum: -90
            type: number
        - explode: false
          in: query
          name: lon1
          required: true
          schema:
            format: double
            maximum: 180
            minimum: -180
            type: number
        - description: Latitude of the second end
          explode: false
          in: query
          name: lat2
          required: true
          schema:
            description: Latitude of the second end
            format: double
            maximum: 90
            minimum: -90
            type: number
        - explode: false
          in: query
          name: lon2
          required: true
          schema:
            format: double
            maximum: 180
            minimum: -180
            type: number
        - description: "Altitude the first end reports, m above sea level; 0 or absent: none, the antenna is put 2 m above the terrain"
          explode: false
          in: query
          name: alt1
          schema:
            description: "Altitude the first end reports, m above sea level; 0 or absent: none, the antenna is put 2 m above the terrain"
            format: double
            type: number
        - description: Altitude the second end reports
          explode: false
          in: query
          name: alt2
          schema:
            description: Altitude the second end reports
            format: double
            type: number
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerrainProfileBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Cross section of the terrain between two points and its line-of-sight class (Kartverket)
      tags:
        - meta
  /api/v1/trends:
    get:
      operationId: trends
      parameters:
        - description: Bucket length
          explode: false
          in: query
          name: bucket
          schema:
            default: day
            description: Bucket length
            enum:
              - day
              - week
              - month
            type: string
        - description: IANA time zone the buckets start in, e.g. Europe/Oslo
          explode: false
          in: query
          name: tz
          schema:
            default: UTC
            description: IANA time zone the buckets start in, e.g. Europe/Oslo
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendsBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Daily, weekly or monthly summaries over the whole retained log
      tags:
        - mesh
  /api/v1/weather:
    get:
      operationId: weather
      parameters:
        - description: Latitude of the point
          explode: false
          in: query
          name: lat
          required: true
          schema:
            description: Latitude of the point
            format: double
            maximum: 90
            minimum: -90
            type: number
        - description: Longitude of the point
          explode: false
          in: query
          name: lon
          required: true
          schema:
            description: Longitude of the point
            format: double
            maximum: 180
            minimum: -180
            type: number
        - description: Inclusive start, RFC 3339
          explode: false
          in: query
          name: start
          required: true
          schema:
            description: Inclusive start, RFC 3339
            examples:
              - "2026-10-28T00:00:00Z"
            type: string
        - description: Exclusive end, RFC 3339; at most the longest window after start
          explode: false
          in: query
          name: end
          required: true
          schema:
            description: Exclusive end, RFC 3339; at most the longest window after start
            examples:
              - "2026-10-31T00:00:00Z"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Hourly weather at a point from MET Norway's analysis (temperature, precipitation)
      tags:
        - meta
