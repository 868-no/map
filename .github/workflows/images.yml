# Build the container images; publish them to GitHub Container Registry from
# main and from version tags (vX.Y.Z). Called by the tests workflow once every
# test job has passed, so nothing untested is published. It has no trigger of
# its own: to rebuild deliberately, run the tests workflow by hand.
# Each image is pushed as sha-<commit> only; the tags deployments pull
# (latest, main, X.Y.Z, X.Y) move to the new images in a last job, once all
# three are built, so a failed build never leaves them naming a mix of commits.
#   ghcr.io/868-no/map-backend   backend/Dockerfile (Go API, ingest, maintenance)
#   ghcr.io/868-no/map-web       web/Dockerfile     (Caddy + built frontend)
#   ghcr.io/868-no/map-basemap   basemap/Dockerfile (Planetiler basemap builder)
name: images

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    # Self-hosted when RUNNER_LABELS is set, for runs on main only (tests.yml).
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write # push to ghcr.io (not used for pull requests)
    strategy:
      fail-fast: false
      matrix:
        include:
          # e2e: the end-to-end images' layer cache (tests.yml), which shares
          # every layer up to the test hook's build argument.
          - image: map-backend
            context: backend
            dockerfile: backend/Dockerfile
            e2e: e2e-backend
          - image: map-web
            context: .
            dockerfile: web/Dockerfile
            e2e: e2e-web
          - image: map-basemap
            context: basemap
            dockerfile: basemap/Dockerfile
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      # Generated protobuf bindings are committed: no submodules needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only this commit's tag here; the promote job adds the shared ones.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=868.no Map: Meshtastic MQTT mesh map (${{ matrix.image }})
            org.opencontainers.image.licenses=GPL-3.0-only

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The web page links to the source it was built from (GPL-3.0).
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            ${{ matrix.e2e && format('type=gha,scope={0}', matrix.e2e) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Points the shared tags at this commit's images, all three, once every
  # build has pushed its sha- tag: copies of the manifest lists (both
  # platforms, provenance and SBOM included), so nothing is rebuilt.
  promote:
    name: tag the images
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag the builds pushed (sha-<short commit>), as they computed it.
      - id: source
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/map-backend
          tags: |
            type=sha,prefix=sha-
      # The shared tags, computed once for the backend image and applied to
      # all three: `latest` and `main` from main, X.Y.Z and X.Y (and latest,
      # unless a pre-release) from a version tag, the branch name otherwise.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/map-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: point the shared tags at this commit's images
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ steps.source.outputs.version }}
          SHARED: ${{ steps.meta.outputs.tags }}
        run: |
          [ -n "$SOURCE" ] || { echo "no source tag"; exit 1; }
          registry="ghcr.io/${OWNER,,}"
          tags=()
          for ref in $SHARED; do tags+=("${ref##*:}"); done
          if [ "${#tags[@]}" -eq 0 ]; then echo "no shared tags for this ref"; exit 0; fi
          for image in map-backend map-web map-basemap; do
            args=()
            for tag in "${tags[@]}"; do args+=(-t "$registry/$image:$tag"); done
            echo "$image:$SOURCE -> ${tags[*]}"
            docker buildx imagetools create "${args[@]}" "$registry/$image:$SOURCE"
          done
