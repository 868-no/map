# Build the container images; publish them to GitHub Container Registry from
# main and from version tags (vX.Y.Z). Called by the tests workflow once every
# test job has passed, so nothing untested is published; run by hand
# (workflow_dispatch) only to rebuild deliberately.
#   ghcr.io/868-no/map-backend   backend/Dockerfile (Go API, ingest, maintenance)
#   ghcr.io/868-no/map-web       web/Dockerfile     (Caddy + built frontend)
#   ghcr.io/868-no/map-basemap   basemap/Dockerfile (Planetiler basemap builder)
name: images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    # Self-hosted when RUNNER_LABELS is set, never for pull requests (tests.yml).
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write # push to ghcr.io (not used for pull requests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: map-backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: map-web
            context: .
            dockerfile: web/Dockerfile
          - image: map-basemap
            context: basemap
            dockerfile: basemap/Dockerfile
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      # Generated protobuf bindings are committed: no submodules needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=868.no Map: Meshtastic MQTT mesh map (${{ matrix.image }})
            org.opencontainers.image.licenses=GPL-3.0-only

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The web page links to the source it was built from (GPL-3.0).
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
