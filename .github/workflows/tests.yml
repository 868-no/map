# Tests on every pull request and push, with the same Docker-wrapped
# toolchains as local development (scripts/*.sh), so CI and laptops agree.
# When they all pass, the images workflow builds (and from main and version
# tags, publishes) the container images: nothing untested reaches ghcr.io.
# A push to main then redeploys production through a Portainer webhook.
# End-to-end tests (frontend/e2e) run against the demo stack: the simulated
# mesh on a local broker, plus two days of seeded history. The basemap is not
# built here (it takes GBs and an hour), so tests that need real map labels
# skip themselves (MESHMAP_NO_BASEMAP); run them against a full deployment.
# Runners: GitHub-hosted, unless the repository variable RUNNER_LABELS names
# self-hosted ones (a JSON list, e.g. ["self-hosted","meshmap"]; see
# deploy/runners): then runs on main (pushes and manual runs) take those.
# Pull requests, which may come from forks, tags, other branches and the
# deploy job always run on GitHub's. The runners themselves refuse any other
# job, since a pull request runs the workflow as it changed it.
name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (vet, format, unit)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: go
          hash: ${{ hashFiles('backend/go.sum', 'scripts/go.sh') }}
      - run: scripts/go.sh go vet ./...
      - name: gofmt
        run: |
          unformatted="$(scripts/go.sh gofmt -l ./cmd ./internal ./test)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      # golangci-lint (backend/.golangci.yml) and govulncheck, pinned and
      # built into the cached GOBIN.
      - name: golangci-lint
        run: |
          scripts/go.sh go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          scripts/go.sh golangci-lint run ./...
      - name: govulncheck
        run: |
          scripts/go.sh go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          scripts/go.sh govulncheck ./...
      # The race detector needs cgo, which the golang bookworm image has on.
      - run: scripts/go.sh go test -race ./...

  integration:
    name: backend integration (Postgres, Redis, Mosquitto)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: go-integration
          hash: ${{ hashFiles('backend/go.sum', 'scripts/go.sh') }}
      - run: scripts/integration.sh

  engine:
    name: engine (Rust tests, golden fixture)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: engine
          hash: ${{ hashFiles('frontend/engine/Cargo.lock', 'scripts/wasm.sh') }}
      - run: scripts/wasm.sh test
      - run: scripts/wasm.sh clippy
      - run: scripts/wasm.sh deny

  frontend:
    name: frontend (types, lint, unit, build)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: frontend
          hash: ${{ hashFiles('frontend/engine/Cargo.lock', 'scripts/wasm.sh', 'frontend/package-lock.json', 'scripts/node.sh') }}
      - name: build the WebAssembly engine
        run: scripts/wasm.sh
      - run: scripts/node.sh npm ci --no-audit --no-fund
      - run: scripts/node.sh sh -c 'npm run typecheck && npm run lint && npm run knip && npx vitest run && npm run build'
      # The API types are generated from docs/api-openapi.yaml (itself checked
      # against the backend by internal/api/openapi_test.go): they must be current.
      - name: generated API types are current
        run: scripts/node.sh npm run gen:api && git diff --exit-code frontend/src/api/schema.d.ts

  e2e:
    # The map renders in software on these runners, so the suite is split
    # across parallel jobs, each with its own stack, running one test at a
    # time: two at once starve the page, and the map takes clicks for long
    # presses.
    name: end-to-end ${{ matrix.shard }}/4 (demo stack, Playwright)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: e2e
          hash: ${{ hashFiles('frontend/package-lock.json') }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: printf 'POSTGRES_PASSWORD=ci\nDEMO_MODE=true\nE2E_HOOKS=true\nDEMO_RATE=10\n' > .env
      # The stack's images from compose.yaml, with layers cached between runs.
      - name: build the stack's images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          E2E_HOOKS: 'true'
        with:
          files: compose.yaml
          targets: backend,web
          load: true
          set: |
            backend.cache-from=type=gha,scope=e2e-backend
            backend.cache-to=type=gha,mode=max,scope=e2e-backend
            web.cache-from=type=gha,scope=e2e-web
            web.cache-to=type=gha,mode=max,scope=e2e-web
      - name: start the demo stack
        run: docker compose --profile demo up -d --no-build postgres redis backend web mosquitto demo-publisher
      - name: seed two days of history
        run: docker compose run --rm backend seed --nodes 150 --rows 20000 --days 2
      - name: wait for live traffic
        run: |
          for _ in $(seq 1 60); do
            n=$(curl -s 'http://localhost:8080/api/v1/observations?limit=5000&duration=1h' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["rows"]))' 2>/dev/null || echo 0)
            [ "$n" -gt 1000 ] && exit 0
            sleep 5
          done
          echo "no live traffic after 5 minutes"; exit 1
      - name: Playwright
        # One retry: a few tests time animations and live traffic on a shared runner.
        run: |
          # npm's cache: the toolchain cache's directory, else (self-hosted) node.sh's volume.
          npm_cache="${MESHMAP_CACHE:+$MESHMAP_CACHE/node}"
          docker run --rm --network host --ipc=host -e MESHMAP_NO_BASEMAP=1 -v "$PWD":/src -w /src/frontend \
            -v "${npm_cache:-meshmap-node-cache}":/cache -e npm_config_cache=/cache/npm \
            mcr.microsoft.com/playwright:v1.64.1-noble sh -c 'npm ci --no-audit --no-fund && npx playwright test --retries 1 --workers 1 --shard=${{ matrix.shard }}/4'
      - name: stack logs
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 200
      - name: keep the failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: frontend/e2e/.results
          include-hidden-files: true # .results is a hidden folder, skipped by default
          retention-days: 7

  images:
    name: images
    needs: [backend, integration, engine, frontend, e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    secrets: inherit

  # Redeploy production once main's images are published: a Portainer stack
  # webhook pulls them and recreates the stack. The webhook URL is its only
  # credential, so it lives in the DEPLOY_WEBHOOK_URL secret, never in the
  # repository; secrets never reach pull requests from forks.
  deploy:
    name: deploy (production)
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deploy at a time, in push order; a newer push's deploy waits.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: call the Portainer webhook
        env:
          HOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "DEPLOY_WEBHOOK_URL is not set: nothing deployed"; exit 1; fi
          curl -fsS -X POST --retry 3 --retry-all-errors --max-time 30 -o /dev/null -w 'webhook: HTTP %{http_code}\n' "$HOOK"
