# Tests on every pull request and push, with the same Docker-wrapped
# toolchains as local development (scripts/*.sh), so CI and laptops agree.
# When they all pass, the images workflow builds (and from main and version
# tags, publishes) the container images: nothing untested reaches ghcr.io.
# A push to main then redeploys production through a Portainer webhook.
# End-to-end tests (frontend/e2e) run against the demo stack: the simulated
# mesh on a local broker, plus two days of seeded history. The basemap is not
# built here (it takes GBs and an hour), so tests that need real map labels
# skip themselves (MESHMAP_NO_BASEMAP); run them against a full deployment.
# Runners: GitHub-hosted, unless the repository variable RUNNER_LABELS names
# self-hosted ones (a JSON list, e.g. ["self-hosted","meshmap"]; see
# deploy/runners): then runs on main (pushes and manual runs) take those.
# Pull requests, which may come from forks, tags, other branches and the
# deploy job always run on GitHub's. The runners themselves refuse any other
# job, since a pull request runs the workflow as it changed it.
name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (vet, format, unit)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every copy of a toolchain version (Dockerfiles, go.mod, Cargo.toml,
      # package.json, README) equals versions.env, which scripts/*.sh read.
      - name: toolchain versions agree
        run: scripts/check-versions.sh
      - uses: ./.github/actions/toolchain-cache
        with:
          name: go
          hash: ${{ hashFiles('backend/go.sum', 'scripts/go.sh', 'versions.env') }}
      - run: scripts/go.sh go vet ./...
      - name: gofmt
        run: |
          unformatted="$(scripts/go.sh gofmt -l ./cmd ./internal ./test)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      # golangci-lint (backend/.golangci.yml) and govulncheck, pinned in
      # versions.env and built into the cached GOBIN. govulncheck fails on a known vulnerability
      # the code can reach, which blocks the images and the deploy.
      - name: golangci-lint
        run: |
          . ./versions.env
          scripts/go.sh go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          scripts/go.sh golangci-lint run ./...
      - name: govulncheck
        run: |
          . ./versions.env
          scripts/go.sh go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          scripts/go.sh govulncheck ./...
      # The race detector needs cgo, which the golang bookworm image has on.
      - run: scripts/go.sh go test -race ./...

  integration:
    name: backend integration (Postgres, Redis, Mosquitto)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: go-integration
          hash: ${{ hashFiles('backend/go.sum', 'scripts/go.sh', 'versions.env') }}
      - run: scripts/integration.sh

  engine:
    name: engine (Rust tests, golden fixture)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: engine
          hash: ${{ hashFiles('frontend/engine/Cargo.lock', 'scripts/wasm.sh', 'versions.env') }}
      - run: scripts/wasm.sh test
      # The views' TypeScript types are generated from the engine's structs
      # by its tests (D-202): they must be current.
      - name: generated view types are current
        run: git diff --exit-code frontend/src/derive/views.gen.ts
      - run: scripts/wasm.sh clippy
      # Advisories (RustSec), yanked versions and sources: blocks the deploy too.
      - run: scripts/wasm.sh deny

  frontend:
    name: frontend (types, lint, unit, build)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: frontend
          hash: ${{ hashFiles('frontend/engine/Cargo.lock', 'scripts/wasm.sh', 'frontend/package-lock.json', 'scripts/node.sh', 'versions.env') }}
      - name: build the WebAssembly engine
        run: scripts/wasm.sh
      - run: scripts/node.sh npm ci --no-audit --no-fund
      # Known vulnerabilities in any npm dependency, development tools included
      # (they build what ships): a finding fails the job, and so blocks the
      # images and the deploy, like govulncheck and cargo-deny.
      - name: npm audit
        run: scripts/node.sh npm audit
      - run: scripts/node.sh sh -c 'npm run typecheck && npm run lint && npm run knip && npx vitest run && npm run build'
      # The API types are generated from docs/api-openapi.yaml (itself checked
      # against the backend by internal/api/openapi_test.go): they must be current.
      - name: generated API types are current
        run: scripts/node.sh npm run gen:api && git diff --exit-code frontend/src/api/schema.d.ts

  # The end-to-end stack's images (the web image with the test hook), built
  # once for all shards: they would otherwise each build the same images and
  # write the same layer caches. Shared as an artifact, which works for pull
  # requests from forks too (they cannot push to the registry).
  e2e-images:
    name: end-to-end images (backend, web with the test hook)
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # compose.yaml requires POSTGRES_PASSWORD even to read its build targets.
      - run: printf 'POSTGRES_PASSWORD=ci\nE2E_HOOKS=true\n' > .env
      # The stack's images from compose.yaml, with layers cached between runs.
      - name: build the stack's images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          E2E_HOOKS: 'true'
        with:
          files: compose.yaml
          targets: backend,web
          load: true
          set: |
            backend.cache-from=type=gha,scope=e2e-backend
            backend.cache-to=type=gha,mode=max,scope=e2e-backend
            web.cache-from=type=gha,scope=e2e-web
            web.cache-to=type=gha,mode=max,scope=e2e-web
      # The tags compose.yaml gives them, so the shards' `up --no-build` finds them.
      - run: docker save -o e2e-images.tar meshmap-backend:local meshmap-web:local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-images
          path: e2e-images.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    # The map renders in software on these runners, so the suite is split
    # across parallel jobs, each with its own stack, running one test at a
    # time: two at once starve the page, and the map takes clicks for long
    # presses.
    name: end-to-end ${{ matrix.shard }}/4 (demo stack, Playwright)
    needs: e2e-images
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-cache
        with:
          name: e2e
          hash: ${{ hashFiles('frontend/package-lock.json') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images
      - name: load the stack's images
        run: docker load -i "$RUNNER_TEMP/e2e-images/e2e-images.tar"
      - run: printf 'POSTGRES_PASSWORD=ci\nDEMO_MODE=true\nE2E_HOOKS=true\nDEMO_RATE=10\n' > .env
      # A fresh database: on a self-hosted runner the named volume of an
      # earlier run's stack (meshmap_pgdata) is still there, and seeding on
      # top of its rows would change what the tests see.
      - name: remove an earlier stack and its volumes
        run: docker compose --profile demo down -v --remove-orphans
      - name: start the demo stack
        run: docker compose --profile demo up -d --no-build postgres redis backend web mosquitto demo-publisher
      - name: seed two days of history
        run: docker compose run --rm backend seed --nodes 150 --rows 20000 --days 2
      - name: wait for live traffic
        run: |
          for _ in $(seq 1 60); do
            n=$(curl -s 'http://localhost:8080/api/v1/observations?limit=5000&duration=1h' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["rows"]))' 2>/dev/null || echo 0)
            [ "$n" -gt 1000 ] && exit 0
            sleep 5
          done
          echo "no live traffic after 5 minutes"; exit 1
      - name: Playwright
        # One retry: a few tests time animations and live traffic on a shared runner.
        run: |
          . ./versions.env # PLAYWRIGHT_VERSION, equal to @playwright/test (scripts/check-versions.sh)
          # npm's cache: the toolchain cache's directory, else (self-hosted) node.sh's volume.
          npm_cache="${MESHMAP_CACHE:+$MESHMAP_CACHE/node}"
          docker run --rm --network host --ipc=host -e MESHMAP_NO_BASEMAP=1 -v "$PWD":/src -w /src/frontend \
            -v "${npm_cache:-meshmap-node-cache}":/cache -e npm_config_cache=/cache/npm \
            "mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION-noble" sh -c 'npm ci --no-audit --no-fund && npx playwright test --retries 1 --workers 1 --shard=${{ matrix.shard }}/4'
      - name: stack logs
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 200
      - name: keep the failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: frontend/e2e/.results
          include-hidden-files: true # .results is a hidden folder, skipped by default
          retention-days: 7
      - name: remove the stack and its volumes
        if: always()
        run: docker compose --profile demo down -v --remove-orphans

  images:
    name: images
    needs: [backend, integration, engine, frontend, e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  # Redeploy production once main's images are published: a Portainer stack
  # webhook pulls them and recreates the stack. The webhook URL is its only
  # credential, so it lives in the DEPLOY_WEBHOOK_URL secret, never in the
  # repository; secrets never reach pull requests from forks.
  deploy:
    name: deploy (production)
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deploy at a time, in push order; a newer push's deploy waits.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: call the Portainer webhook
        env:
          HOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "DEPLOY_WEBHOOK_URL is not set: nothing deployed"; exit 1; fi
          curl -fsS -X POST --retry 3 --retry-all-errors --max-time 30 -o /dev/null -w 'webhook: HTTP %{http_code}\n' "$HOOK"
      # The webhook answering is not a deploy: wait until the site serves the
      # web image of this commit (/version.txt) and the backend answers
      # /health/ready with 200 (ready, or degraded but serving). The site is
      # the repository variable PRODUCTION_URL; `none` skips this check.
      - name: wait for production to serve this commit
        env:
          SITE: ${{ vars.PRODUCTION_URL || 'https://beta-map.868.no' }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$SITE" = none ]; then echo "PRODUCTION_URL is none: not checked"; exit 0; fi
          SITE="${SITE%/}"
          deadline=$((SECONDS + 900))
          while :; do
            # A query string of its own: no cache in front of the site answers it.
            served=$(curl -fsS --max-time 10 "$SITE/version.txt?deploy=$GITHUB_RUN_ID-$SECONDS" 2>/dev/null | head -c 100 | tr -d '[:space:]' || true)
            ready=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$SITE/health/ready" 2>/dev/null || true)
            if [ "$served" = "$SHA" ] && [ "$ready" = 200 ]; then
              echo "$SITE serves $SHA; /health/ready:"
              curl -fsS --max-time 10 "$SITE/health/ready" || true; echo
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::after 15 minutes $SITE serves web revision '${served:0:40}' (expected $SHA) and /health/ready answers HTTP ${ready:-none}"
              exit 1
            fi
            sleep 15
          done
