# 868.no Map: production on Docker Swarm, with the HTTP API scaled out (D-157).
# Same images and configuration as compose.production.yaml, split into:
#
#   ingest   `meshmap serve`: MQTT ingest, plus the only process that fetches
#            weather (MET) and terrain (Geonorge) upstream and knows broker
#            state. Exactly ONE replica: the broker client_id is fixed, and two
#            would keep disconnecting each other.
#   backend  `meshmap serve --no-ingest`: the HTTP API, API_REPLICAS replicas
#            (default 2), weather and terrain fetching off; live rows arrive
#            over Redis pub/sub.
#   web      Caddy: sends /api/v1/weather, /api/v1/terrain*, /api/v1/capabilities
#            and /health/* to FETCH_UPSTREAM (ingest), the rest of /api/* to
#            API_UPSTREAM (backend), see web/Caddyfile.
#
#   docker stack deploy -c deploy/stack.swarm.yaml meshmap     (or a Portainer stack)
#
# Values written ${LIKE_THIS} come from the stack's environment (Portainer's
# env panel, or `export` before `docker stack deploy`). See docs/operations.md,
# "Scaling horizontally (Swarm)", for what scales, connection budgeting and
# the limits that become per replica.
#
# Swarm ignores `restart:` and `depends_on:`; services restart through
# deploy.restart_policy and the backend waits for the database by itself.
version: "3.8"

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  DEMO_MODE: "false"
  # Map defaults and windows (see backend/internal/config/config.go for all options)
  DEFAULT_MAP_LAT: "63.43"
  DEFAULT_MAP_LON: "10.40"
  DEFAULT_MAP_ZOOM: "7"
  RETENTION_MONTHS: "6"
  # Shown in the privacy policy (/privacy.html).
  OPERATOR_NAME: ${OPERATOR_NAME:-}
  OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
  # Connections per process: the ingest process opens both pools, each API
  # replica only DB_API_CONNS. Keep the total under Postgres max_connections
  # (docs/operations.md).
  DB_API_CONNS: ${DB_API_CONNS:-12}
  DB_INGEST_CONNS: ${DB_INGEST_CONNS:-6}
  # Weather (D-133) and terrain (D-143): fetched by the ingest service only.
  WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
  TERRAIN_ENABLED: ${TERRAIN_ENABLED:-true}
  # Brokers and channel keys: the same YAML as config/examples/*.yaml.
  MQTT_BROKERS: |
    brokers:
      # mqtt-buffer, below: it stays subscribed to the real broker while this
      # process restarts, and holds what arrives meanwhile for this client's
      # persistent session (design §2.1, D-205). The id is the real broker's,
      # so provenance and deduplication are unchanged.
      - id: no868
        host: mqtt-buffer
        port: 1883
        protocol: v5
        tls: { enabled: false }
        client_id: meshmap-ingest-1
        session_expiry: 1h
        topics:
          - { filter: "msh/#", qos: 1 }
        accept_retained: false
  CHANNEL_KEYS: |
    channels:
      - { name: LongFast, broker_ids: ["*"], mode: ctr, psks: ["AQ=="] }
      - { name: NarrowFast, broker_ids: ["*"], mode: ctr, psks: ["AQ=="] }

# Liveness, not readiness: Swarm replaces an unhealthy task, and a database
# outage must not restart ingest (its queue absorbs the outage) nor churn
# the API replicas. See docs/operations.md, "Data loss windows".
x-healthcheck: &backend-healthcheck
  test: ["CMD", "/usr/local/bin/meshmap", "healthcheck", "--live"]
  interval: 10s
  timeout: 5s
  start_period: 30s
  retries: 6

x-restart: &restart
  restart_policy:
    condition: any
    delay: 5s

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: meshmap
      POSTGRES_USER: meshmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # max_connections: 100 (the default) fits ingest (18) + maintenance (2) +
    # up to 5 API replicas (12 each, plus one more during a rolling update).
    command: [postgres, -c, max_connections=100, -c, shared_buffers=512MB, -c, effective_cache_size=2GB,
              -c, work_mem=32MB, -c, maintenance_work_mem=256MB, -c, max_wal_size=2GB, -c, random_page_cost=1.1]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshmap -d meshmap"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
    deploy:
      <<: *restart
      replicas: 1
      # Never two servers on one data directory.
      update_config: { order: stop-first }
      # With per-node volumes instead of NFS, pin it to the node holding the data:
      # placement: { constraints: ["node.hostname == DB_NODE"] }

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      <<: *restart
      replicas: 1

  # MQTT buffer (D-205): a local Mosquitto bridged to the real broker. Its
  # image is pinned and its definition rarely changes, so an app deploy
  # leaves it running: it keeps receiving while the backend restarts and
  # queues what arrives for the backend's persistent session (session_expiry
  # above), which gets it on reconnect, observed a few seconds late. Without
  # it every deploy lost the traffic of the restart: the real broker does not
  # queue QoS 0 messages for an offline session. Reachable on the stack's
  # network only. The upstream password must not contain spaces.
  mqtt-buffer:
    image: eclipse-mosquitto:2.1.2-alpine
    environment:
      MQTT_UPSTREAM: ${MQTT_UPSTREAM:-mqtt.868.no:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD}
    command:
      - sh
      - -ec
      - |
        umask 077
        {
          printf '%s\n' 'listener 1883' 'allow_anonymous true' 'persistence false' \
            'queue_qos0_messages true' 'max_queued_messages 100000' 'max_inflight_messages 100' \
            'persistent_client_expiration 1d' 'connection_messages false' 'log_type error' 'log_type warning' 'log_type notice' \
            'connection upstream'
          printf 'address %s\n' "$$MQTT_UPSTREAM"
          printf '%s\n' 'remote_clientid meshmap-buffer-1' 'cleansession true' 'try_private false' \
            'restart_timeout 5 60' 'topic msh/# in 0'
          printf 'remote_username %s\nremote_password %s\n' "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        } > /tmp/buffer.conf
        exec mosquitto -c /tmp/buffer.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      <<: *restart
      replicas: 1
      update_config: { order: stop-first }

  # MQTT ingest + weather/terrain fetching + /health. Exactly one.
  ingest:
    image: ghcr.io/868-no/map-backend:${MESHMAP_TAG:-latest}
    command: ["serve"]
    environment: *backend-env
    healthcheck: *backend-healthcheck
    # Drains MQTT, flushes the writer and finishes requests on SIGTERM.
    stop_grace_period: 30s
    deploy:
      <<: *restart
      replicas: 1
      # Stop the old task before starting the new one: two would share the
      # broker client_id and kick each other off.
      update_config: { order: stop-first, failure_action: rollback }

  # The HTTP API, scaled out. Weather and terrain off: only ingest fetches.
  backend:
    image: ghcr.io/868-no/map-backend:${MESHMAP_TAG:-latest}
    command: ["serve", "--no-ingest"]
    environment:
      <<: *backend-env
      WEATHER_ENABLED: "false"
      TERRAIN_ENABLED: "false"
    healthcheck: *backend-healthcheck
    stop_grace_period: 20s
    deploy:
      <<: *restart
      replicas: ${API_REPLICAS:-2}
      update_config: { order: start-first, parallelism: 1, delay: 10s, failure_action: rollback }

  maintenance:
    image: ghcr.io/868-no/map-backend:${MESHMAP_TAG:-latest}
    command: ["maintenance"]
    environment: *backend-env
    deploy:
      <<: *restart
      replicas: 1

  # Nightly backup (D-206): pg_dump of the whole database at BACKUP_HOUR_UTC
  # (default 02:00, before retention at 03:00), and at start when the newest
  # dump is a day old or missing. Each dump is checked with pg_restore --list
  # before it replaces the .partial file; dumps older than BACKUP_KEEP_DAYS
  # (default 7) are deleted after a good one, and a run is skipped when the
  # disk has less than twice the last dump's size free. The status goes to
  # Redis hourly for /health/ready ("backup"), which the production monitor
  # watches. The backups volume is on this host: an NFS export, like pgdata,
  # so put it on a different server or disk from pgdata.
  backup:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - backups:/backups
    command:
      - sh
      - -c
      - |
        set -eu
        dir=/backups keep=$${BACKUP_KEEP_DAYS:-7} hour=$${BACKUP_HOUR_UTC:-2}
        export PGHOST=postgres PGUSER=meshmap PGDATABASE=meshmap PGPASSWORD="$$POSTGRES_PASSWORD"
        ok=null try=null file= bytes=0 ms=0 failed=false
        iso() { date -u -d "@$$1" +%Y-%m-%dT%H:%M:%SZ; }
        newest() { ls -1 "$$dir"/meshmap-*.dump 2>/dev/null | sort | tail -n 1; }
        publish() {
          k=meshmap:backup:status
          v=$$(printf '{"last_success":%s,"last_attempt":%s,"file":"%s","bytes":%s,"duration_ms":%s,"failed":%s,"keep_days":%s}' \
            "$$ok" "$$try" "$$file" "$$bytes" "$$ms" "$$failed" "$$keep")
          printf '*3\r\n$$3\r\nSET\r\n$$%s\r\n%s\r\n$$%s\r\n%s\r\n' "$${#k}" "$$k" "$${#v}" "$$v" |
            nc -w 3 redis 6379 >/dev/null 2>&1 || echo "backup: status not stored in Redis" >&2
        }
        run() {
          t0=$$(date -u +%s) try="\"$$(iso "$$t0")\""
          f="$$dir/meshmap-$$(date -u -d "@$$t0" +%Y%m%dT%H%M%SZ).dump"
          need=$$(( (bytes > 0 ? bytes * 2 : 1073741824) / 1024 ))
          avail=$$(df -Pk "$$dir" | awk 'NR==2 {print $$4}')
          if [ "$$avail" -lt "$$need" ]; then
            failed=true; echo "backup skipped: $${avail} KiB free in $$dir, want $${need} KiB" >&2
          elif pg_dump -Fc -f "$$f.partial" && pg_restore --list "$$f.partial" >/dev/null; then
            mv "$$f.partial" "$$f"
            ok=$$try file=$$(basename "$$f") bytes=$$(stat -c %s "$$f") failed=false
            find "$$dir" -name 'meshmap-*.dump' -mmin +$$((keep * 1440)) -exec rm -f {} +
            echo "backup: $$file, $$bytes bytes"
          else
            rm -f "$$f.partial"; failed=true; echo "backup failed" >&2
          fi
          ms=$$(( ($$(date -u +%s) - t0) * 1000 ))
          publish
        }
        mkdir -p "$$dir"; rm -f "$$dir"/*.partial
        n=$$(newest)
        if [ -n "$$n" ]; then
          ok="\"$$(iso "$$(stat -c %Y "$$n")")\"" file=$$(basename "$$n") bytes=$$(stat -c %s "$$n")
        fi
        publish
        if [ -z "$$n" ] || [ $$(( $$(date -u +%s) - $$(stat -c %Y "$$n") )) -ge 86400 ]; then run; fi
        while :; do
          now=$$(date -u +%s); next=$$(( now - now % 86400 + hour * 3600 ))
          [ "$$next" -gt "$$now" ] || next=$$((next + 86400))
          while :; do
            left=$$(( next - $$(date -u +%s) )); [ "$$left" -gt 0 ] || break
            sleep $$(( left < 3600 ? left : 3600 )); publish
          done
          run
        done
    deploy:
      <<: *restart
      replicas: 1

  web:
    image: ghcr.io/868-no/map-web:${MESHMAP_TAG:-latest}
    environment:
      API_UPSTREAM: backend:8000
      FETCH_UPSTREAM: ingest:8000
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-} # e.g. an online basemap's host (docs/basemap.md)
      APP_URL: ${APP_URL:-} # the site's own address: other hosts redirect there (empty: none do; D-211)
    # The reverse proxy's upstream (Swarm ingress: any node). An ingress port
    # cannot be bound to loopback and bypasses ufw and similar host
    # firewalls: firewall it in DOCKER-USER, or better use the overlay
    # network below (docs/operations.md, "HTTPS / reverse proxy").
    ports:
      - "8080:80"
    volumes:
      - basemap:/srv/tiles:ro
    # To reach web from a tunnel/proxy container on an external overlay
    # network instead of a published port, drop `ports` and add:
    # networks: [default, edge]
    deploy:
      <<: *restart
      replicas: 2
      update_config: { order: start-first, parallelism: 1 }

  # Builds the basemap into the shared volume; see compose.production.yaml.
  basemap:
    image: ghcr.io/868-no/map-basemap:${MESHMAP_TAG:-latest}
    environment:
      BASEMAP_AREA: norway
      BASEMAP_BOUNDS: world
      BASEMAP_MAX_AGE_DAYS: "30"
      PLANETILER_HEAP: 8g
    volumes:
      - basemap:/data
    deploy:
      <<: *restart
      replicas: 1
      update_config: { order: stop-first }

# networks:
#   edge:
#     external: true
#     name: EDGE_NETWORK   # the overlay the tunnel/proxy container is on

# A named volume in Swarm is created on whichever node a task lands, one per
# node. pgdata must be the same data wherever postgres runs, and basemap is
# written by `basemap` and read by every `web` replica, so both are NFS
# volumes here (fill in the server and export paths), or else pin the
# services to one node with placement constraints.
# NFS caveats:
# - Postgres's entrypoint chowns its data directory: export pgdata with
#   no_root_squash, or chown it beforehand to uid/gid 70 (postgres in
#   postgres:16-alpine).
# - Docker never updates a named volume's driver_opts once it exists on a
#   node: to change them, remove the volume on every node (docker volume rm
#   meshmap_pgdata / meshmap_basemap) and redeploy.
# - Planetiler's downloads and temporary files (several GB during a build)
#   go to the basemap volume.
volumes:
  pgdata:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:?set NFS_SERVER},nfsvers=4.1,rw,hard
      device: ":${NFS_PGDATA_PATH:-/export/meshmap/pgdata}"
  basemap:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:?set NFS_SERVER},nfsvers=4.1,rw,hard
      device: ":${NFS_BASEMAP_PATH:-/export/meshmap/basemap}"
  backups:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_BACKUP_SERVER:-${NFS_SERVER:?set NFS_SERVER}},nfsvers=4.1,rw,hard
      device: ":${NFS_BACKUP_PATH:-/export/meshmap/backups}"
