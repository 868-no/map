[package]
name = "meshmap-probe"
version = "0.1.0"
edition = "2024"
description = "The map's mesh derivation (frontend/engine) run natively against a deployment's rows: one self-contained binary for Linux, macOS and Windows"
license = "GPL-3.0-only"
repository = "https://github.com/868-no/map"
publish = false

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
meshmap-engine = { path = "../../frontend/engine" }
serde_json = "=1.0.154"
# HTTPS without the system's curl or OpenSSL: rustls with ring, verifying
# certificates against the operating system's trust store (no bundled roots).
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# scripts/probe.sh: release speed without the whole-program link on every change.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

# As frontend/engine/Cargo.toml.
[lints.clippy]
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
manual_midpoint = "warn"
stable_sort_primitive = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
unnested_or_patterns = "warn"
needless_collect = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
large_types_passed_by_value = "warn"
