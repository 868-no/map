# cargo-deny (scripts/wasm.sh deny probe): known vulnerabilities and unmaintained
# crates (RustSec), duplicate versions, and crates from anywhere but crates.io.

# Only the platforms the release binaries are built for
# (.github/workflows/probe.yml): rustls-platform-verifier's Android crates
# (jni, and the older syn its macros use) are never built.
[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The engine is a path dependency (no version): allowed, as the crate is not published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
