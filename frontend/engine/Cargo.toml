[package]
name = "meshmap-engine"
version = "0.1.0"
edition = "2024"
description = "Mesh view derivation for the browser (WebAssembly): row store, links, location estimates, traffic, node details, packet logs and routes"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
# The views' TypeScript types, generated at `cargo test` time (src/view_types.rs, D-202).
ts-rs = "=12.0.1"

[profile.release]
# Speed over size: opt-level "s" is about 10 % less to download (33 KB
# gzipped), but views build 10-15 % and health 35 % slower, on every live
# rebuild (docs/benchmarks.md).
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Tests: release speed (the golden fixture replays a 12 h window) without
# the shipped wasm's whole-program link for every test binary.
[profile.test-fast]
inherits = "release"
lto = false
codegen-units = 16

# Clippy's default groups (warnings are errors in scripts/wasm.sh clippy),
# plus the pedantic and nursery lints that point at waste or a smell rather
# than style: copies and clones not needed, needless wrapping, hand-written
# versions of what the standard library has.
[lints.clippy]
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
manual_midpoint = "warn"
stable_sort_primitive = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
unnested_or_patterns = "warn"
needless_collect = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
large_types_passed_by_value = "warn"
