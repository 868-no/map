[package]
name = "meshmap-engine"
version = "0.1.0"
edition = "2024"
description = "Mesh view derivation for the browser (WebAssembly): row store, links, location estimates, traffic, node details, packet logs and routes"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
