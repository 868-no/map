[package]
name = "meshmap-engine"
version = "0.1.0"
edition = "2024"
description = "Mesh view derivation for the browser (WebAssembly): row store, links, location estimates, traffic, node details, packet logs and routes"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[profile.release]
# Size over speed: about 10 % less to download than opt-level 3, for views
# 10-15 % slower (docs/benchmarks.md).
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
